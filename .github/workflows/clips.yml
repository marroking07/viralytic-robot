name: Clips Viralytic

on:
  schedule:
    - cron: '41 17 * * *'   # 1 vez al día (11:41 am en México): revisa canales fijos y arma los clips del día
  workflow_dispatch: {}       # botón "Run workflow" para probar a mano

permissions:
  id-token: write   # para que tu app reconozca a este robot sin contraseñas
  contents: read

concurrency:
  group: clips
  cancel-in-progress: false

jobs:
  clips:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: denoland/setup-deno@v2   # YouTube lo necesita para sus retos de JavaScript
        with:
          deno-version: v2.x
      - name: Instalar ffmpeg, yt-dlp y faster-whisper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
          sudo apt-get install -y -qq fonts-montserrat > /dev/null || true
          pip install -q -U "yt-dlp[default,curl-cffi]" faster-whisper
          yt-dlp --version
      - name: Recordar el modelo de voz a texto entre corridas
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: faster-whisper-small-v1
      - name: Armar clips
        env:
          APP_URL: https://viralytic-ai.pll-studio.workers.dev
          WHISPER_MODEL: small
          BUDGET_MIN: '45'
        run: |
          cat > clips.mjs <<'CLIPS_EOF'
          // Robot de CLIPS de Viralytic AI (corre en GitHub Actions, archivo .github/workflows/clips.yml).
          // 1) Revisa los canales fijos y mete los videos nuevos a la fila.
          // 2) Del siguiente video de la fila baja SOLO el audio de un tramo (p. ej. 30 min), lo transcribe con
          //    faster-whisper ("small", español) y la IA gratis de tu app (Llama 3.3) escoge los mejores momentos.
          // 3) Baja solo esos tramos del video y arma cada clip vertical 9:16 con título gancho, contexto al inicio,
          //    subtítulos palabra por palabra y crédito visible al creador. Nunca repite tramos ya usados.
          // 4) Los deja en "Aprobación". Nunca publica.
          import {execFileSync, spawnSync} from 'node:child_process';
          import {mkdirSync, writeFileSync, readFileSync, statSync, rmSync, existsSync, createWriteStream} from 'node:fs';
          import {join} from 'node:path';
          import {Readable} from 'node:stream';
          import {pipeline} from 'node:stream/promises';

          const APP = (process.env.APP_URL || '').replace(/\/$/, '');
          const WORK = process.env.WORK_DIR || '/tmp/clips';
          const WHISPER = process.env.WHISPER_MODEL || 'small';
          const BUDGET_MIN = Number(process.env.BUDGET_MIN || 45); // después de esto ya no empieza trabajo nuevo
          const T0 = Date.now();
          const elapsedMin = () => (Date.now() - T0) / 60000;
          if (!APP) throw Error('Falta APP_URL');

          // ---------- Acceso a la app: token de identidad de GitHub (OIDC) ----------
          let cached = {value: '', at: 0};
          async function credential() {
            if (process.env.ROBOT_TOKEN) return process.env.ROBOT_TOKEN;
            if (cached.value && Date.now() - cached.at < 120000) return cached.value;
            const url = process.env.ACTIONS_ID_TOKEN_REQUEST_URL, token = process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
            if (!url || !token) throw Error('GitHub no entregó el token de identidad. Revisa "permissions: id-token: write".');
            const r = await fetch(url + '&audience=viralytic-ai', {headers: {Authorization: 'bearer ' + token}});
            if (!r.ok) throw Error('No se pudo obtener el token de GitHub (' + r.status + ')');
            cached = {value: (await r.json()).value, at: Date.now()};
            return cached.value;
          }
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
          async function request(path, init = {}, tries = 3, timeout = 330000) {
            for (let attempt = 1; ; attempt++) {
              let r;
              try {
                r = await fetch(APP + '/api/' + path, {...init, headers: {Authorization: 'Bearer ' + (await credential()), ...(init.headers || {})}, signal: AbortSignal.timeout(timeout)});
              } catch (e) {
                if (attempt < tries) { await sleep(5000 * attempt); continue; }
                throw Error('Sin conexión con la app en ' + path + ': ' + e.message);
              }
              if (r.status >= 500 && r.status !== 503 && attempt < tries) { await sleep(5000 * attempt); continue; }
              return r;
            }
          }
          async function api(path, body) {
            const r = await request(path, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body || {})});
            const j = await r.json().catch(() => ({}));
            if (!r.ok) throw Error(j.error || path + ' respondió ' + r.status);
            return j;
          }
          const log = (m) => console.log(new Date().toISOString().slice(11, 19) + ' ' + m);

          // ---------- Herramientas ----------
          const ff = (args) => execFileSync('ffmpeg', ['-hide_banner', '-loglevel', 'error', '-y', ...args], {stdio: ['ignore', 'inherit', 'inherit'], maxBuffer: 1 << 26});
          const probe = (file) => Number(execFileSync('ffprobe', ['-v', 'error', '-show_entries', 'format=duration', '-of', 'csv=p=0', file]).toString().trim()) || 0;
          function probeVideo(src, headers) {
            try {
              const args = ['-v', 'error', '-select_streams', 'v:0', '-show_entries', 'stream=width,height', '-of', 'json'];
              if (headers) args.push('-headers', headers);
              const j = JSON.parse(execFileSync('ffprobe', [...args, src], {timeout: 120000}).toString());
              return j.streams?.[0] || {};
            } catch {
              return {};
            }
          }
          function ytdlp(args, timeout = 300000) {
            const r = spawnSync('yt-dlp', ['--no-warnings', '--no-progress', ...args], {encoding: 'utf8', maxBuffer: 1 << 28, timeout});
            if (r.status !== 0) {
              const err = String(r.stderr || r.error?.message || 'yt-dlp falló').split('\n').filter((l) => /ERROR|error/i.test(l)).slice(-2).join(' ') || String(r.stderr).slice(-400);
              throw Error(err.replace(/\s+/g, ' ').slice(0, 400));
            }
            return r.stdout;
          }
          const BLOCKED = /sign in to confirm|not a bot|confirm you.?re not|HTTP Error 429|HTTP Error 403|403: Forbidden|cloudflare|captcha|Requested format is not available.*login/i;

          /** Baja un archivo de la app a disco sin cargarlo todo en memoria (sirve para archivos de varios GB). */
          async function streamToFile(path, file) {
            const r = await request(path.replace(/^\/api\//, ''), {}, 3, 45 * 60000);
            if (!r.ok) throw Error('No se pudo bajar el archivo (' + r.status + ')');
            await pipeline(Readable.fromWeb(r.body), createWriteStream(file));
            return file;
          }

          // ---------- Transcripción con faster-whisper ----------
          const WHISPER_PY = `
          import sys, json, os, time, wave
          import numpy as np
          from faster_whisper import WhisperModel
          audio, out, name = sys.argv[1], sys.argv[2], sys.argv[3]
          t0 = time.time()
          # El audio ya viene en WAV 16 kHz mono: se lee directo (sin PyAV, que a veces no coincide de versión).
          with wave.open(audio, "rb") as w:
              data = np.frombuffer(w.readframes(w.getnframes()), dtype=np.int16).astype(np.float32) / 32768.0
          m = WhisperModel(name, device="cpu", compute_type="int8", cpu_threads=os.cpu_count() or 2)
          segs, info = m.transcribe(data, language="es", vad_filter=True, vad_parameters={"min_silence_duration_ms": 500},
                                    word_timestamps=True, beam_size=1, condition_on_previous_text=False)
          res = []
          last = 0
          for s in segs:
              res.append({"s": round(s.start, 2), "e": round(s.end, 2), "t": s.text.strip(),
                          "w": [{"s": round(w.start, 2), "e": round(w.end, 2), "w": w.word.strip()} for w in (s.words or []) if w.word.strip()]})
              if s.end - last > 300:
                  last = s.end
                  print(f"  transcrito {int(s.end // 60)} min en {int(time.time() - t0)} s", flush=True)
          json.dump(res, open(out, "w", encoding="utf-8"), ensure_ascii=False)
          print(f"  listo: {len(res)} frases en {int(time.time() - t0)} s", flush=True)
          `;

          // ---------- Listar videos nuevos de un canal fijo ----------
          const KICK_PY = `
          import sys, json
          from curl_cffi import requests
          slug = sys.argv[1]
          out = []
          err = ""
          for url in [f"https://kick.com/api/v2/channels/{slug}/videos", f"https://kick.com/api/v1/channels/{slug}"]:
              try:
                  r = requests.get(url, impersonate="chrome", timeout=40, headers={"Accept": "application/json"})
                  if r.status_code != 200:
                      err = f"Kick respondió {r.status_code}"
                      continue
                  data = r.json()
                  items = data if isinstance(data, list) else (data.get("previous_livestreams") or data.get("data") or [])
                  for v in items[:15]:
                      vid = (v.get("video") or {}).get("uuid") or v.get("uuid")
                      if not vid:
                          continue
                      dur = v.get("duration") or 0
                      out.append({"id": vid, "url": f"https://kick.com/{slug}/videos/{vid}", "title": v.get("session_title") or v.get("title") or "",
                                  "duration": round(dur / 1000) if dur > 100000 else dur, "date": v.get("start_time") or v.get("created_at") or "", "live": bool(v.get("is_live"))})
                  if out:
                      break
              except Exception as e:
                  err = str(e)[:200]
          print(json.dumps({"videos": out, "error": "" if out else err}))
          `;

          // Kick: yt-dlp falla con sus VODs (usa una API que ya no existe), así que se usa la API v1 y el m3u8 directo.
          const KICK_VOD_PY = `
          import sys, json
          from urllib.parse import urljoin
          from curl_cffi import requests
          uuid = sys.argv[1]
          r = requests.get(f"https://kick.com/api/v1/video/{uuid}", impersonate="chrome", timeout=40, headers={"Accept": "application/json"})
          if r.status_code != 200:
              print(json.dumps({"error": f"Kick respondió {r.status_code} al pedir el video"}))
              sys.exit(0)
          j = r.json()
          ls = j.get("livestream") or {}
          src = j.get("source") or ls.get("source")
          out = {"source": src, "duration": round((ls.get("duration") or 0) / 1000), "title": ls.get("session_title") or "",
                 "channel": (ls.get("channel") or {}).get("slug") or "", "live": bool(ls.get("is_live")), "variants": []}
          if src:
              m = requests.get(src, impersonate="chrome", timeout=40)
              lines = m.text.splitlines()
              for i, l in enumerate(lines):
                  if l.startswith("#EXT-X-STREAM-INF"):
                      bw = int((l.split("BANDWIDTH=")[1].split(",")[0]) if "BANDWIDTH=" in l else 0)
                      h = int(l.split("RESOLUTION=")[1].split(",")[0].split("x")[1]) if "RESOLUTION=" in l else 0
                      nxt = next((x for x in lines[i + 1:] if x and not x.startswith("#")), None)
                      if nxt:
                          out["variants"].append({"url": urljoin(src, nxt), "h": h, "bw": bw})
          print(json.dumps(out))
          `;
          function kickVod(url) {
            const uuid = (url.match(/\/videos?\/([0-9a-f-]{36})/i) || [])[1];
            if (!uuid) return null;
            const dir = join(WORK, 'py');
            mkdirSync(dir, {recursive: true});
            const py = join(dir, 'kickvod.py');
            writeFileSync(py, KICK_VOD_PY);
            const r = spawnSync('python3', [py, uuid], {encoding: 'utf8', timeout: 120000});
            const j = JSON.parse((r.stdout || '').trim().split('\n').pop() || '{}');
            if (j.error || !j.variants?.length) throw Error(j.error || 'Kick no dio el video (' + String(r.stderr || '').slice(-200) + ')');
            if (j.live) throw Error('Ese stream sigue EN VIVO. Agrégalo cuando termine (el link del video guardado).');
            const vs = j.variants.sort((a, b) => a.bw - b.bw);
            const audio = vs[0];
            const video = [...vs].reverse().find((v) => v.h && v.h <= 1080) || vs[vs.length - 1];
            return {
              duration: j.duration,
              title: j.title,
              creator: j.channel,
              handle: j.channel ? '@' + j.channel : '',
              audio: {url: audio.url},
              video: {url: video.url, height: video.h, width: Math.round((video.h * 16) / 9)},
              videoAudio: null,
            };
          }

          async function listSource(src) {
            const dir = join(WORK, 'py');
            mkdirSync(dir, {recursive: true});
            if (src.platform === 'kick') {
              const slug = (src.handle || '').replace(/^@/, '') || new URL(src.url).pathname.split('/').filter(Boolean)[0];
              const py = join(dir, 'kick.py');
              writeFileSync(py, KICK_PY);
              const r = spawnSync('python3', [py, slug], {encoding: 'utf8', timeout: 120000});
              const j = JSON.parse((r.stdout || '').trim().split('\n').pop() || '{}');
              if (!j.videos?.length) throw Error(j.error || 'Kick no regresó videos');
              return j.videos;
            }
            let url = src.url;
            if (src.platform === 'twitch') {
              const login = (src.handle || '').replace(/^@/, '') || new URL(src.url).pathname.split('/').filter(Boolean)[0];
              url = `https://www.twitch.tv/${login}/videos?filter=archives&sort=time`;
            } else if (src.platform === 'youtube' && !/\/(videos|streams|shorts)\/?$/.test(url) && !/[?&]list=/.test(url)) {
              url = url.replace(/\/$/, '') + '/videos';
            }
            const j = JSON.parse(ytdlp(['--flat-playlist', '-J', '--playlist-end', '8', url], 180000));
            return (j.entries || []).map((v) => ({
              id: String(v.id || v.url),
              url: v.url && /^https?:/.test(v.url) ? v.url : src.platform === 'youtube' ? 'https://www.youtube.com/watch?v=' + v.id : src.platform === 'twitch' ? 'https://www.twitch.tv/videos/' + String(v.id).replace(/^v/, '') : v.url,
              title: v.title || '',
              duration: v.duration || 0,
              live: v.live_status === 'is_live' || v.is_live === true,
            }));
          }

          // ---------- Fuente del video: link (yt-dlp) o archivo subido ----------
          function headerArg(h) {
            if (!h) return '';
            return Object.entries(h).filter(([k]) => !/^accept-encoding$/i.test(k)).map(([k, v]) => `${k}: ${v}`).join('\r\n') + '\r\n';
          }
          /** Escoge formatos: audio liviano (para transcribir) y video hasta 1080p (para cortar los clips). */
          function pickFormats(info) {
            const fs = (info.formats || []).filter((f) => f.url && f.protocol !== 'mhtml');
            const hasA = (f) => f.acodec && f.acodec !== 'none';
            const hasV = (f) => f.vcodec && f.vcodec !== 'none';
            const size = (f) => f.tbr || f.abr || f.vbr || (f.height || 0) * 10 || 1e9;
            const audioOnly = fs.filter((f) => hasA(f) && !hasV(f)).sort((a, b) => size(b) - size(a));
            const muxed = fs.filter((f) => hasA(f) && hasV(f));
            const audio = audioOnly.find((f) => (f.abr || 0) <= 160) || audioOnly[0] || muxed.sort((a, b) => size(a) - size(b))[0];
            const okH = (f) => (f.height || 0) <= 1080 && (f.height || 0) >= 360;
            const bestMuxed = muxed.filter(okH).sort((a, b) => (b.height || 0) - (a.height || 0) || size(b) - size(a))[0];
            const videoOnly = fs.filter((f) => hasV(f) && !hasA(f) && okH(f)).sort((a, b) => (b.height || 0) - (a.height || 0) || (/avc|h264/.test(b.vcodec) ? 1 : 0) - (/avc|h264/.test(a.vcodec) ? 1 : 0))[0];
            let video, videoAudio = null;
            if (bestMuxed && (!videoOnly || (bestMuxed.height || 0) >= (videoOnly.height || 0))) video = bestMuxed;
            else if (videoOnly) {
              video = videoOnly;
              videoAudio = audioOnly[0] || audio;
            } else video = muxed.sort((a, b) => (b.height || 0) - (a.height || 0))[0];
            if (!audio || !video) throw Error('No se encontró un formato descargable');
            return {audio, video, videoAudio};
          }

          async function prepareSource(item) {
            if (item.fileUrl) {
              const file = join(WORK, 'src-' + item.id + '.bin');
              if (!existsSync(file)) {
                log('Bajando el archivo que subiste…');
                await streamToFile(item.fileUrl, file);
              }
              const duration = probe(file);
              return {duration, title: item.title, local: file, audio: {url: file}, video: {url: file}, videoAudio: null};
            }
            if (item.platform === 'kick') {
              const k = kickVod(item.url);
              if (k) return k;
            }
            const info = JSON.parse(ytdlp(['-J', '--no-playlist', item.url], 240000));
            if (info.is_live || info.live_status === 'is_live') throw Error('Ese stream sigue EN VIVO. Agrégalo cuando termine (el link del video guardado).');
            const {audio, video, videoAudio} = pickFormats(info);
            return {
              duration: Number(info.duration) || 0,
              title: info.title || info.fulltitle || '',
              creator: info.uploader || info.channel || info.creator || '',
              handle: info.uploader_id && !/^UC[\w-]{20,}$/.test(info.uploader_id) ? '@' + String(info.uploader_id).replace(/^@/, '') : '',
              audio, video, videoAudio,
            };
          }

          /** Baja SOLO el audio del tramo [from, to] en 16 kHz mono (lo que necesita whisper). */
          function grabAudio(src, from, to, out) {
            const h = headerArg(src.audio.http_headers);
            const args = ['-ss', String(from), '-t', String(to - from)];
            if (h) args.push('-headers', h);
            args.push('-i', src.audio.url, '-vn', '-ac', '1', '-ar', '16000', '-c:a', 'pcm_s16le', out);
            ff(args);
            return out;
          }

          // ---------- Subtítulos y textos del clip (ASS) ----------
          const W = 1080, H = 1920;
          const assEscape = (t) => String(t || '').replace(/[{}\\]/g, '').replace(/\n/g, ' ');
          function assTime(t) {
            const cs = Math.max(0, Math.round(t * 100));
            const h = Math.floor(cs / 360000), m = Math.floor(cs / 6000) % 60, s = Math.floor(cs / 100) % 60, c = cs % 100;
            return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${String(c).padStart(2, '0')}`;
          }
          const FONT = process.env.CLIP_FONT || 'Montserrat';

          /** Grupos de 2-3 palabras grandes; la palabra que se está diciendo va en amarillo (como en Don Chito). */
          function captionEvents(words, dur) {
            const ev = [];
            const groups = [];
            let g = [];
            for (const w of words) {
              g.push(w);
              const len = g.map((x) => x.w).join(' ').length;
              const pause = words[words.indexOf(w) + 1] ? words[words.indexOf(w) + 1].s - w.e > 0.6 : true;
              if (g.length >= 3 || len >= 16 || /[.!?¿¡,]$/.test(w.w) || pause) {
                groups.push(g);
                g = [];
              }
            }
            if (g.length) groups.push(g);
            for (const grp of groups) {
              for (let k = 0; k < grp.length; k++) {
                const w = grp[k];
                const start = Math.max(0, w.s);
                const end = Math.min(dur, k + 1 < grp.length ? grp[k + 1].s : Math.max(w.e, w.s + 0.25) + 0.15);
                if (end - start < 0.05) continue;
                const text = grp
                  .map((x, j) => {
                    const t = assEscape(x.w.toUpperCase().replace(/[.,;:]+$/, ''));
                    return j === k ? `{\\c&H4AD8FF&\\fscx112\\fscy112}${t}{\\c&HFFFFFF&\\fscx100\\fscy100}` : t;
                  })
                  .join(' ');
                ev.push(`Dialogue: 1,${assTime(start)},${assTime(end)},Cap,,0,0,0,,${text}`);
              }
            }
            return ev;
          }

          function clipAss(m, words, dur, credit, videoTop, videoBottom) {
            const hookEnd = Math.min(3.6, dur);
            const capY = Math.min(H - 330, videoBottom + 170);
            const head = `[Script Info]
          ScriptType: v4.00+
          PlayResX: ${W}
          PlayResY: ${H}
          WrapStyle: 0
          ScaledBorderAndShadow: yes

          [V4+ Styles]
          Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
          Style: Title,${FONT},62,&H00FFFFFF,&H00FFFFFF,&H00000000,&H96000000,-1,0,0,0,100,100,0,0,1,5,3,8,70,70,${Math.max(140, videoTop - 330)},1
          Style: Hook,${FONT},78,&H004AD8FF,&H00FFFFFF,&H00000000,&H96000000,-1,0,0,0,100,100,0,0,1,6,3,8,60,60,${Math.max(140, videoTop - 360)},1
          Style: Context,${FONT},40,&H00FFFFFF,&H00FFFFFF,&H00000000,&HB4000000,-1,0,0,0,100,100,0,0,3,14,0,2,90,90,${H - videoTop + 26},1
          Style: Cap,${FONT},74,&H00FFFFFF,&H00FFFFFF,&H00000000,&H96000000,-1,0,0,0,100,100,0,0,1,6,2,8,60,60,${capY},1
          Style: Credit,${FONT},38,&H00FFFFFF,&H00FFFFFF,&H00000000,&H96000000,-1,0,0,0,100,100,0,0,1,3,2,2,60,60,120,1

          [Events]
          Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
          `;
            const ev = [];
            const hook = m.hook || '';
            if (hook) {
              ev.push(`Dialogue: 2,${assTime(0)},${assTime(hookEnd)},Hook,,0,0,0,,{\\fad(120,160)\\t(0,180,\\fscx108\\fscy108)\\t(180,320,\\fscx100\\fscy100)}${assEscape(hook.toUpperCase())}`);
              ev.push(`Dialogue: 2,${assTime(hookEnd)},${assTime(dur)},Title,,0,0,0,,{\\fad(200,0)}${assEscape(m.title)}`);
            } else ev.push(`Dialogue: 2,${assTime(0)},${assTime(dur)},Title,,0,0,0,,${assEscape(m.title)}`);
            if (m.context) ev.push(`Dialogue: 3,${assTime(0.2)},${assTime(Math.min(dur, 4.6))},Context,,0,0,0,,{\\fad(150,250)}CONTEXTO: ${assEscape(m.context)}`);
            ev.push(...captionEvents(words, dur));
            ev.push(`Dialogue: 2,${assTime(0)},${assTime(dur)},Credit,,0,0,0,,${assEscape(credit)}`);
            return head + ev.join('\n') + '\n';
          }

          /** Arma el clip vertical: fondo desenfocado + video completo al centro + textos. Un solo paso de ffmpeg. */
          function renderClip(src, m, words, credit, out) {
            const dur = Math.round((m.end - m.start) * 100) / 100;
            const v = src.video, va = src.videoAudio;
            const hv = headerArg(v.http_headers);
            const dims = src.local ? probeVideo(src.local) : v.width && v.height ? {width: v.width, height: v.height} : probeVideo(v.url, hv);
            const vw = dims.width || 1920, vh = dims.height || 1080;
            const vertical = vh / vw > 1.3;
            // Altura del video al centro (16:9 → 1080x608).
            const fgH = vertical ? H : Math.round((W * vh) / vw / 2) * 2;
            const top = vertical ? 0 : Math.round((H - fgH) / 2 / 2) * 2 - 40;
            const ass = out.replace(/\.mp4$/, '.ass');
            writeFileSync(ass, clipAss(m, words, dur, credit, vertical ? 700 : top, vertical ? 1200 : top + fgH));
            const inputs = ['-ss', String(m.start)];
            if (hv) inputs.push('-headers', hv);
            inputs.push('-t', String(dur), '-i', v.url);
            if (va) {
              const ha = headerArg(va.http_headers);
              inputs.push('-ss', String(m.start));
              if (ha) inputs.push('-headers', ha);
              inputs.push('-t', String(dur), '-i', va.url);
            }
            const fontsdir = '/usr/share/fonts';
            const graph = vertical
              ? `[0:v]scale=${W}:${H}:force_original_aspect_ratio=increase,crop=${W}:${H},setsar=1,fps=30,ass=${ass}:fontsdir=${fontsdir},format=yuv420p[v]`
              : `[0:v]split=2[a][b];[a]scale=${W}:${H}:force_original_aspect_ratio=increase,crop=${W}:${H},boxblur=28:4,eq=brightness=-0.16:saturation=1.1[bg];[b]scale=${W}:${fgH},setsar=1[fg];[bg][fg]overlay=0:${top},fps=30,ass=${ass}:fontsdir=${fontsdir},format=yuv420p[v]`;
            // Tope de calidad para que el archivo no pase de ~85 MB (límite de la app).
            const maxrate = Math.min(9000, Math.floor((85 * 8000) / Math.max(20, dur)));
            ff([...inputs, '-filter_complex', graph, '-map', '[v]', '-map', va ? '1:a:0' : '0:a:0?', '-c:v', 'libx264', '-preset', 'veryfast', '-crf', '21', '-maxrate', maxrate + 'k', '-bufsize', maxrate * 2 + 'k', '-c:a', 'aac', '-b:a', '160k', '-ar', '48000', '-af', 'loudnorm=I=-14:TP=-1.5:LRA=11', '-movflags', '+faststart', '-t', String(dur), out]);
            return {file: out, duration: probe(out)};
          }

          // ---------- Trabajo de un video de la fila ----------
          const PLATFORM = {youtube: 'YouTube', kick: 'Kick', twitch: 'Twitch', archivo: '', otro: ''};
          let made = 0, windows = 0;

          async function workItem(item, need, cfg) {
            log(`Video: ${item.title || item.url || 'archivo subido'} (${item.handle || item.creator || 'sin crédito'})`);
            let src;
            try {
              src = await prepareSource(item);
            } catch (e) {
              const blocked = BLOCKED.test(e.message);
              const msg = blocked
                ? (item.platform === 'youtube'
                    ? 'YouTube bloqueó la descarga desde GitHub ("confirma que no eres un bot"). Usa el mismo stream en Kick o Twitch, o sube el archivo en la pestaña Clips.'
                    : 'La plataforma bloqueó la descarga desde GitHub. Prueba el link de otra plataforma o sube el archivo.') + ' (' + e.message.slice(0, 160) + ')'
                : e.message;
              log('No se pudo abrir: ' + msg);
              await api('robot/clips-item', {id: item.id, error: msg, blocked});
              return {stop: false};
            }
            await api('robot/clips-item', {id: item.id, title: src.title, duration: src.duration, creator: src.creator, handle: src.handle});
            const handle = item.handle || src.handle || (item.creator ? '@' + item.creator.replace(/\s+/g, '') : '');
            const platform = PLATFORM[item.platform] || '';
            const credit = `Clip de ${handle || item.creator || 'su creador'}${platform ? ' · ' + platform : ''}`;
            let cursor = item.cursor || 0;
            while (made < need && windows < 4 && elapsedMin() < BUDGET_MIN) {
              const total = src.duration || 0;
              if (total && cursor >= total - 20) {
                await api('robot/clips-item', {id: item.id, finished: true});
                log('Este video ya se revisó completo.');
                return {stop: false};
              }
              const from = cursor, to = total ? Math.min(total, from + cfg.windowMin * 60) : from + cfg.windowMin * 60;
              windows++;
              const dir = join(WORK, 'w' + windows);
              mkdirSync(dir, {recursive: true});
              log(`Bajando solo el audio de ${Math.round(from / 60)} a ${Math.round(to / 60)} min…`);
              const wav = join(dir, 'audio.wav');
              try {
                grabAudio(src, from, to, wav);
              } catch (e) {
                const blocked = BLOCKED.test(e.message);
                await api('robot/clips-item', {id: item.id, error: 'No se pudo bajar el audio: ' + e.message.slice(0, 300), blocked});
                return {stop: false};
              }
              const got = probe(wav);
              if (got < 20) {
                await api('robot/clips-item', {id: item.id, finished: true});
                return {stop: false};
              }
              log(`Transcribiendo ${Math.round(got / 60)} min con faster-whisper (${WHISPER})…`);
              const py = join(WORK, 'py', 'whisper.py');
              mkdirSync(join(WORK, 'py'), {recursive: true});
              writeFileSync(py, WHISPER_PY);
              const tj = join(dir, 'tr.json');
              const tw = Date.now();
              execFileSync('python3', [py, wav, tj, WHISPER], {stdio: ['ignore', 'inherit', 'inherit'], timeout: 80 * 60000});
              log(`Transcripción en ${Math.round((Date.now() - tw) / 1000)} s.`);
              const segs = JSON.parse(readFileSync(tj, 'utf8')).map((x) => ({...x, s: x.s + from, e: x.e + from, w: x.w.map((w) => ({...w, s: w.s + from, e: w.e + from}))}));
              cursor = from + got;
              const {moments = []} = await api('robot/clips-pick', {id: item.id, from, to: cursor, need: need - made, segments: segs.map((x) => ({s: x.s, e: x.e, t: x.t}))});
              log(`La IA escogió ${moments.length} momentos.`);
              for (const m of moments) {
                if (made >= need || elapsedMin() > BUDGET_MIN + 15) break;
                const words = segs.flatMap((x) => x.w).filter((w) => w.s >= m.start - 0.05 && w.e <= m.end + 0.3).map((w) => ({...w, s: w.s - m.start, e: w.e - m.start}));
                const transcript = segs.filter((x) => x.e > m.start && x.s < m.end).map((x) => x.t).join(' ');
                const out = join(dir, `clip-${made + 1}.mp4`);
                log(`Armando clip: "${m.title}" (${Math.round(m.start / 60)}:${String(Math.round(m.start % 60)).padStart(2, '0')}, ${Math.round(m.end - m.start)} s)`);
                let rendered;
                try {
                  rendered = renderClip(src, m, words, credit, out);
                } catch (e) {
                  log('No se pudo armar este clip: ' + e.message);
                  continue;
                }
                let p;
                try {
                  p = await api('robot/clip-create', {itemId: item.id, start: m.start, end: m.end, title: m.title, hook: m.hook, context: m.context, transcript});
                } catch (e) {
                  log('Se saltó: ' + e.message);
                  continue;
                }
                try {
                  const size = statSync(out).size;
                  if (size > 94e6) throw Error('El clip pesa ' + Math.round(size / 1e6) + ' MB (máximo 94)');
                  const r = await request('video', {
                    method: 'POST',
                    headers: {'Content-Type': 'video/mp4', 'X-Project-Id': p.id, 'X-Render-Token': p.renderToken, 'X-Scene-Durations': JSON.stringify(p.scenes.map((s) => s.duration))},
                    body: readFileSync(out),
                  });
                  const j = await r.json().catch(() => ({}));
                  if (!r.ok) throw Error(j.error || 'La app no aceptó el video (' + r.status + ')');
                  made++;
                  log(`✔ Clip ${made}/${need} listo para aprobación.`);
                  // Portada: un cuadro del clip.
                  try {
                    const jpg = out.replace(/\.mp4$/, '.jpg');
                    ff(['-ss', String(Math.min(rendered.duration * 0.45, rendered.duration - 0.5)), '-i', out, '-frames:v', '1', '-vf', 'scale=720:1280', '-q:v', '4', jpg]);
                    await request('clip-thumb', {method: 'POST', headers: {'Content-Type': 'image/jpeg', 'X-Project-Id': p.id}, body: readFileSync(jpg)});
                  } catch {}
                } catch (e) {
                  log('No se pudo subir: ' + e.message);
                  await api('robot/clip-fail', {id: p.id, itemId: item.id, start: m.start, end: m.end, error: e.message}).catch(() => {});
                }
              }
              rmSync(wav, {force: true});
            }
            return {stop: false};
          }

          async function main() {
            mkdirSync(WORK, {recursive: true});
            let next = await api('robot/clips-next', {});
            if (next.action === 'check' || (next.sources || []).length) {
              for (const s of next.sources || []) {
                try {
                  const videos = await listSource(s);
                  const r = await api('robot/clips-found', {sourceId: s.id, videos});
                  log(`Canal ${s.name || s.handle}: ${videos.length} videos revisados, ${r.added} nuevos a la fila.`);
                } catch (e) {
                  const msg = BLOCKED.test(e.message) ? 'La plataforma bloqueó la revisión desde GitHub: ' + e.message.slice(0, 200) : e.message.slice(0, 300);
                  log(`Canal ${s.name || s.handle}: ${msg}`);
                  await api('robot/clips-found', {sourceId: s.id, videos: [], error: msg}).catch(() => {});
                }
              }
              next = await api('robot/clips-next', {});
            }
            if (next.action !== 'work') {
              log('Nada que hacer: ' + (next.reason || 'sin videos en la fila'));
              if (next.reason) await api('robot/clips-log', {result: next.reason}).catch(() => {});
              return;
            }
            const need = next.need;
            const seen = new Set();
            while (next.action === 'work' && made < need && windows < 4 && elapsedMin() < BUDGET_MIN) {
              const key = next.item.id + ':' + next.item.cursor;
              if (seen.has(key)) break; // no repetir el mismo tramo en la misma vuelta
              seen.add(key);
              await workItem(next.item, need, next.cfg);
              if (made >= need) break;
              next = await api('robot/clips-next', {});
            }
            const result = made ? `${made} clip${made === 1 ? '' : 's'} nuevo${made === 1 ? '' : 's'} en Aprobación.` : 'Esta vuelta no salió ningún clip (revisa la fila en la pestaña Clips).';
            log(result + ` Tiempo: ${Math.round(elapsedMin())} min.`);
            await api('robot/clips-log', {result}).catch(() => {});
          }

          export {captionEvents, clipAss, pickFormats, renderClip};
          if (process.argv[1] && import.meta.url.endsWith(process.argv[1].split('/').pop())) {
            try {
              await main();
            } catch (e) {
              log('Error: ' + e.message);
              await api('robot/clips-log', {result: 'Error del robot de clips: ' + e.message.slice(0, 300)}).catch(() => {});
              process.exitCode = 1;
            }
          }
          CLIPS_EOF
          node clips.mjs
