name: Encender Don Chito (una vez)

on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  encender:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Encender canal Don Chito
        env:
          APP_URL: https://viralytic-ai.pll-studio.workers.dev
        run: |
          cat > on.mjs <<'EOF'
          const APP = process.env.APP_URL;
          const t = await fetch(process.env.ACTIONS_ID_TOKEN_REQUEST_URL + '&audience=viralytic-ai', {headers: {Authorization: 'bearer ' + process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}}).then(r => r.json());
          const H = {Authorization: 'Bearer ' + t.value, 'Content-Type': 'application/json'};
          const g = await fetch(APP + '/api/autopilot?canal=donchito', {headers: H});
          const cur = await g.json();
          console.log('ANTES', g.status, JSON.stringify(cur.settings).slice(0, 600));
          if (!g.ok) process.exit(1);
          const p = await fetch(APP + '/api/autopilot', {method: 'POST', headers: H, body: JSON.stringify({...cur.settings, enabled: true, canal: 'donchito'})});
          const out = await p.json();
          console.log('DESPUES', p.status, 'enabled=' + out.settings?.enabled, 'canal=' + out.channel, 'temas=' + (out.settings?.queue || []).length);
          const m = await fetch(APP + '/api/autopilot?canal=marro', {headers: H}).then(r => r.json());
          console.log('MARRO enabled=' + m.settings?.enabled, JSON.stringify(m.summary).slice(0, 300));
          if (!p.ok || !out.settings?.enabled) process.exit(1);
          EOF
          node on.mjs
