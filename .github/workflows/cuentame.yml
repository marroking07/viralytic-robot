name: Promo Cuentame

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: voz
          run-id: 41884601751
          github-token: ${{ github.token }}
          path: vz
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Render
        env:
          B: 
        run: |
          mkdir w && cd w
          echo "$B" | base64 -d | tar xz
          pip install -q imageio-ffmpeg numpy
          FF=$(python -c "import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())")
          python -c "import json,base64;d=json.load(open('../vz/voz.json'));[open(f'l{i}.ogg','wb').write(base64.b64decode(x['b64'])) for i,x in enumerate(d)]"
          for i in 0 1 2 3 4; do $FF -y -loglevel error -i l$i.ogg -ar 44100 -ac 1 l$i.wav; done
          python mix.py
          npm init -y > /dev/null && npm i -s playwright@1.48.2
          CH=chrome FF=$FF node render2.cjs
          $FF -y -loglevel error -i video.mp4 -i mix.wav -c:v copy -c:a aac -b:a 160k -shortest out.mp4
          ls -la out.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: cuentame
          path: w/out.mp4
