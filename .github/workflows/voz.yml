name: Voz Don Chito

on:
  workflow_dispatch:
    inputs:
      lineas:
        description: 'Frases separadas por |'
        required: true
        default: '¡Quiúbole, raza! ¿Ya nos sigues?|Aquí hay historias de espanto del rancho mexicano.|Misterios del campo... ¡hasta ovnis, compadre!|Y recetas de rancho, como las de la abuela.|¡Síguenos en arroba donchito punto rancho! ¡Ándele, no se haga!'

permissions:
  contents: read

jobs:
  voz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Voz con edge-tts
        env:
          LINEAS: ${{ inputs.lineas }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q edge-tts
          cat > voz.py <<'PY'
          import asyncio, os, json, base64, subprocess, edge_tts
          async def main():
              out = []
              for i, t in enumerate(os.environ['LINEAS'].split('|')):
                  t = t.strip()
                  await edge_tts.Communicate(t, 'es-MX-JorgeNeural', rate='-5%', pitch='-2Hz').save(f'l{i}.mp3')
                  subprocess.run(['ffmpeg','-loglevel','error','-y','-i',f'l{i}.mp3','-ac','1','-ar','24000','-c:a','libopus','-b:a','20k',f'l{i}.ogg'], check=True)
                  d = float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','csv=p=0',f'l{i}.mp3']).decode().strip())
                  out.append({'text': t, 'dur': d, 'b64': base64.b64encode(open(f'l{i}.ogg','rb').read()).decode()})
              json.dump(out, open('voz.json','w'))
          asyncio.run(main())
          PY
          python3 voz.py
          ls -la voz.json
      - uses: actions/upload-artifact@v4
        with:
          name: voz
          path: voz.json
