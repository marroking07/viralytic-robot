name: Autopiloto Viralytic

on:
  schedule:
    - cron: '17 */3 * * *'   # cada 3 horas revisa si toca producir un video
  workflow_dispatch: {}       # botón "Run workflow" para probar a mano

permissions:
  id-token: write   # para que tu app reconozca a este robot sin contraseñas
  contents: read

concurrency:
  group: autopiloto
  cancel-in-progress: false

jobs:
  producir:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar ffmpeg y voces gratis (edge-tts)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
          sudo apt-get install -y -qq fonts-montserrat > /dev/null || true
          pip install -q edge-tts
      - name: Recordar Remotion entre corridas
        uses: actions/cache@v4
        with:
          path: /tmp/remotion-kit/node_modules
          key: remotion-4.0.528-v1
      - name: Producir video
        env:
          APP_URL: https://viralytic-ai.pll-studio.workers.dev
          REMOTION_DIR: /tmp/remotion-kit
        run: |
          cat > robot.mjs <<'ROBOT_EOF'
          // Robot del autopiloto de Viralytic AI.
          // Corre en GitHub Actions: pide a tu app el siguiente video, genera guion/imágenes con tu app,
          // la voz con edge-tts (gratis) y arma el MP4 (MARRO con ffmpeg, Don Chito con Remotion).
          // Lo deja "LISTO PARA REVISIÓN". Nunca publica: tú apruebas en la app.
          import {execFileSync} from 'node:child_process';
          import {mkdirSync, writeFileSync, readFileSync, statSync, rmSync, existsSync} from 'node:fs';
          import {join} from 'node:path';
          import {createHash} from 'node:crypto';
          import {cpus} from 'node:os';

          const APP = (process.env.APP_URL || '').replace(/\/$/, '');
          const WORK = process.env.WORK_DIR || '/tmp/viralytic';
          if (!APP) throw Error('Falta APP_URL');

          // ---------- Acceso: token de identidad de GitHub (OIDC) o token fijo ----------
          let cached = {value: '', at: 0};
          async function credential() {
            if (process.env.ROBOT_TOKEN) return process.env.ROBOT_TOKEN;
            if (cached.value && Date.now() - cached.at < 120000) return cached.value;
            const url = process.env.ACTIONS_ID_TOKEN_REQUEST_URL, token = process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
            if (!url || !token) throw Error('GitHub no entregó el token de identidad. Revisa "permissions: id-token: write".');
            const r = await fetch(url + '&audience=viralytic-ai', {headers: {Authorization: 'bearer ' + token}});
            if (!r.ok) throw Error('No se pudo obtener el token de GitHub (' + r.status + ')');
            cached = {value: (await r.json()).value, at: Date.now()};
            return cached.value;
          }

          async function request(path, init = {}, tries = 3) {
            for (let attempt = 1; ; attempt++) {
              let r;
              try {
                r = await fetch(APP + '/api/' + path, {
                  ...init,
                  headers: {Authorization: 'Bearer ' + (await credential()), ...(init.headers || {})},
                  signal: AbortSignal.timeout(330000),
                });
              } catch (e) {
                if (attempt < tries) { await sleep(5000 * attempt); continue; }
                throw Error('Sin conexión con la app en ' + path + ': ' + e.message);
              }
              if (r.status >= 500 && r.status !== 503 && attempt < tries) { await sleep(5000 * attempt); continue; }
              return r;
            }
          }
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

          async function api(path, body) {
            const r = await request(path, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body || {})});
            const j = await r.json().catch(() => ({}));
            if (!r.ok) throw Error(j.error || path + ' respondió ' + r.status);
            return j;
          }
          async function download(url, file) {
            const r = await request(url.replace(/^\/api\//, ''));
            if (!r.ok) throw Error('No se pudo descargar ' + url);
            writeFileSync(file, Buffer.from(await r.arrayBuffer()));
            return file;
          }

          // ---------- Voz gratis con edge-tts (voces de Microsoft) ----------
          let edgeBroken = false;
          const EDGE_PY = `
          import asyncio, sys, json, edge_tts
          async def main(text, voice, rate, pitch, out, words):
              try:
                  c = edge_tts.Communicate(text, voice, rate=rate, pitch=pitch, boundary="WordBoundary")
              except TypeError:
                  c = edge_tts.Communicate(text, voice, rate=rate, pitch=pitch)
              ws = []
              with open(out, "wb") as f:
                  async for ch in c.stream():
                      if ch["type"] == "audio":
                          f.write(ch["data"])
                      elif ch["type"] == "WordBoundary":
                          ws.append({"t": round(ch["offset"] / 1e7, 3), "w": ch["text"]})
              with open(words, "w", encoding="utf-8") as f:
                  json.dump(ws, f, ensure_ascii=False)
          asyncio.run(main(*sys.argv[1:]))
          `;

          /** Genera la voz de una escena con edge-tts y la sube a la app (con los tiempos de cada palabra para los subtítulos). */
          async function edgeVoice(p, i, {rate = '+0%', pitch = '+0Hz'} = {}) {
            const dir = join(WORK, 'tts');
            mkdirSync(dir, {recursive: true});
            const py = join(dir, 'edge.py');
            if (!existsSync(py)) writeFileSync(py, EDGE_PY);
            const text = p.scenes[i].text, voice = p.edgeVoice || 'es-MX-JorgeNeural';
            const out = join(dir, `${p.id}-${i}.mp3`), words = join(dir, `${p.id}-${i}.json`);
            let last;
            for (let attempt = 1; attempt <= 3; attempt++) {
              try {
                execFileSync('python3', [py, text, voice, rate, pitch, out, words], {stdio: ['ignore', 'ignore', 'pipe'], timeout: 120000});
                if (statSync(out).size > 1000) { last = null; break; }
                last = Error('audio vacío');
              } catch (e) {
                last = Error(String(e.stderr || e.message).trim().split('\n').pop());
              }
              await sleep(3000 * attempt);
            }
            if (last) throw last;
            let w = '';
            try {
              const b64 = Buffer.from(readFileSync(words, 'utf8')).toString('base64');
              if (b64.length < 7500) w = b64;
            } catch {}
            const r = await request('audio-upload', {
              method: 'POST',
              headers: {
                'Content-Type': 'audio/mpeg',
                'X-Project-Id': p.id,
                'X-Scene-Index': String(i),
                'X-Scene-Hash': createHash('sha256').update(text).digest('hex'),
                'X-Voice-Engine': 'edge-tts',
                'X-Voice-Id': voice,
                ...(w ? {'X-Words': w} : {}),
              },
              body: readFileSync(out),
            });
            const j = await r.json().catch(() => ({}));
            if (!r.ok) throw Error(j.error || 'La app no aceptó la voz');
            return j;
          }

          // ---------- Producción con la IA de tu app ----------
          async function produce(p) {
            if (p.channel === 'donchito') return produceDonChito(p);
            const id = p.id;
            const total = () => p.scenes.length * 2 + 3;
            let done = 0;
            const step = (stage, message, scene) =>
              api('production-state', {id, progress: {stage, message: 'Autopiloto · ' + message, scene, total: p.scenes.length, done, steps: total(), status: 'running'}}).catch(() => {});

            if (!p.autopilot?.scriptDone) {
              await step('script', 'escribiendo el guion');
              p = await api('ai-script', {id, brief: p.brief || ''});
              p = await api('robot/report', {id, scriptDone: true});
              log('Guion listo: ' + p.title + ' (' + p.scenes.length + ' escenas)');
            }
            await step('direction', 'eligiendo voz y estilo');
            p = await api('ai-direction', {id, force: false});
            done++;
            const voice = p.aiVoice || 'marin', style = p.voiceStyle || 'explainer';
            for (let i = 0; i < p.scenes.length; i++) {
              if (!p.scenes[i].image) {
                await step('image', `imagen ${i + 1} de ${p.scenes.length}`, i + 1);
                p = await api('ai-image', {id, index: i, prompt: p.scenes[i].visualPrompt || '', force: false});
              }
              done++;
              const a = p.scenes[i].audio;
              const edge = p.voiceEngine === 'edge' && !edgeBroken;
              const wanted = edge ? 'Edge · ' + (p.edgeVoice || 'es-MX-JorgeNeural') : 'Voz IA · ' + voice;
              if (!a || a.text !== p.scenes[i].text || a.voice !== wanted || (!edge && a.style !== style)) {
                await step('voice', `voz ${i + 1} de ${p.scenes.length}`, i + 1);
                let ok = false;
                if (edge) {
                  try {
                    p = await edgeVoice(p, i, {rate: '-6%', pitch: '-4Hz'});
                    ok = true;
                  } catch (e) {
                    edgeBroken = true;
                    log('edge-tts falló, se usa la voz de OpenAI: ' + e.message);
                  }
                }
                if (!ok) p = await api('voice', {id, index: i, voice, voiceStyle: style, force: false});
              }
              done++;
              log(`Escena ${i + 1}/${p.scenes.length} lista`);
            }
            if (!p.thumbnailImage) {
              await step('thumbnail', 'creando la portada');
              p = await api('ai-thumbnail', {id, title: p.coverTitle || p.title, prompt: p.coverPrompt || ''});
            }
            done++;
            await step('render', 'armando el video');
            const job = await api('render', {id});
            const {file, durations} = await render(job);
            log('Video armado: ' + (statSync(file).size / 1e6).toFixed(1) + ' MB');
            const r = await request('video', {
              method: 'POST',
              headers: {
                'Content-Type': 'video/mp4',
                'X-Project-Id': id,
                'X-Render-Token': job.renderToken,
                'X-Scene-Durations': JSON.stringify(durations),
              },
              body: readFileSync(file),
            });
            const result = await r.json().catch(() => ({}));
            if (!r.ok) throw Error(result.error || 'La app no aceptó el video');
            await api('production-state', {id, progress: {stage: 'complete', message: 'Autopiloto · listo para tu aprobación', total: p.scenes.length, done: total(), steps: total(), status: 'complete'}}).catch(() => {});
            return result;
          }

          // ---------- Don Chito: guion e imágenes gratis (app), voz edge-tts, edición con Remotion ----------
          async function produceDonChito(p) {
            const id = p.id;
            const steps = () => p.scenes.length * 2 + 3;
            let done = 0;
            const step = (stage, message, scene) =>
              api('production-state', {id, progress: {stage, message: 'Don Chito · ' + message, scene, total: p.scenes.length, done, steps: steps(), status: 'running'}}).catch(() => {});

            if (!p.autopilot?.scriptDone) {
              await step('script', 'escribiendo el guion (IA gratis)');
              p = await api('ai-script', {id, brief: p.brief || ''});
              p = await api('robot/report', {id, scriptDone: true});
              log('Guion listo: ' + p.title + ' (' + p.scenes.length + ' escenas)');
            }
            for (let i = 0; i < p.scenes.length; i++) {
              if (!p.scenes[i].image) {
                await step('image', `dibujando escena ${i + 1} de ${p.scenes.length}`, i + 1);
                // Solo el fondo: a Don Chito lo dibuja Remotion con código encima.
                const bg = String(p.scenes[i].visualPrompt || p.scenes[i].text).replace(/don chito('s)?/gi, 'the');
                p = await api('ai-image', {id, index: i, prompt: bg + '. Background scene only, without Don Chito: no people, no humans, no stick figures. Keep the left third of the picture simple and mostly empty.', force: false});
              }
              done++;
              const a = p.scenes[i].audio;
              if (!a || a.text !== p.scenes[i].text || !String(a.voice || '').startsWith('Edge · ')) {
                await step('voice', `voz ${i + 1} de ${p.scenes.length}`, i + 1);
                p = await edgeVoice(p, i, {rate: '+4%', pitch: '-2Hz'});
              }
              done++;
              if (i % 5 === 4 || i === p.scenes.length - 1) log(`Escenas ${i + 1}/${p.scenes.length} listas`);
            }
            if (!p.thumbnailImage) {
              await step('thumbnail', 'creando la portada');
              p = await api('ai-thumbnail', {id, title: p.coverTitle || p.title, prompt: p.coverPrompt || ''}).catch((e) => (log('Portada: ' + e.message), p));
            }
            done++;
            await step('render', 'editando con Remotion');
            const job = await api('render', {id});
            const {file, durations} = await renderRemotion(job);
            log('Video armado: ' + (statSync(file).size / 1e6).toFixed(1) + ' MB');
            const r = await request('video', {
              method: 'POST',
              headers: {'Content-Type': 'video/mp4', 'X-Project-Id': id, 'X-Render-Token': job.renderToken, 'X-Scene-Durations': JSON.stringify(durations)},
              body: readFileSync(file),
            });
            const result = await r.json().catch(() => ({}));
            if (!r.ok) throw Error(result.error || 'La app no aceptó el video');
            await api('production-state', {id, progress: {stage: 'complete', message: 'Don Chito · listo para tu aprobación', total: p.scenes.length, done: steps(), steps: steps(), status: 'complete'}}).catch(() => {});

            // Del video largo salen 3 Shorts (mismas imágenes y voz, sin gastar IA).
            if (p.format !== 'Short') {
              const {created = []} = await api('robot/shorts', {id}).catch((e) => (log('Shorts: ' + e.message), {}));
              for (const c of created) {
                try {
                  log('Short: ' + c.title);
                  await produceDonChito(c);
                } catch (e) {
                  log('Short con error: ' + e.message);
                  await api('robot/report', {id: c.id, error: e.message}).catch(() => {});
                }
              }
            }
            return result;
          }

          /** Pose de Don Chito según la escena (misma lógica que remotion/Chito.tsx). */
          function poseFor(text, visual, i, total) {
            const v = (visual + ' ' + text).toLowerCase();
            if (i === total - 1) return 'feliz';
            if (/point|señal|mira|look at|this is/.test(v)) return 'senala';
            if (/think|wonder|piens|imagin|¿/.test(v) && i % 2 === 0) return 'piensa';
            if (/surpris|shock|scared|asust|sorpren|increíble|!/.test(v)) return 'sorprendido';
            if (/sad|worr|cry|trist|sequía|drought|sick|enferm|muri/.test(v)) return 'triste';
            if (/walk|camin|travel|road|camino|ride|horse|caballo/.test(v)) return 'camina';
            if (/work|milk|dig|hammer|cook|carry|plant|harvest|ordeñ|trabaj|cocin|siembr|cosech|cargar|build/.test(v)) return 'trabaja';
            if (/happy|laugh|party|fiesta|feliz|celebr|boda|wedding/.test(v)) return 'feliz';
            return i % 3 === 1 ? 'senala' : 'habla';
          }

          const KIT = {
          "package.json": "{\n  \"name\": \"donchito-remotion\",\n  \"private\": true,\n  \"dependencies\": {\n    \"@remotion/cli\": \"4.0.528\",\n    \"remotion\": \"4.0.528\",\n    \"react\": \"19.2.0\",\n    \"react-dom\": \"19.2.0\"\n  }\n}\n",
          "src/index.ts": "import {registerRoot} from 'remotion';\nimport {RemotionRoot} from './Root';\nregisterRoot(RemotionRoot);\n",
          "src/Root.tsx": "import React from 'react';\nimport {Composition, CalculateMetadataFunction} from 'remotion';\nimport {DonChito, Props} from './DonChito';\n\nconst calc: CalculateMetadataFunction<Props> = ({props}) => ({\n  durationInFrames: Math.max(30, props.scenes.reduce((a, s) => a + s.frames, 0)),\n  width: props.format === 'Short' ? 1080 : 1920,\n  height: props.format === 'Short' ? 1920 : 1080,\n});\n\nexport const RemotionRoot: React.FC = () => (\n  <Composition\n    id=\"DonChito\"\n    component={DonChito}\n    durationInFrames={300}\n    fps={30}\n    width={1920}\n    height={1080}\n    defaultProps={{format: 'Video largo', hook: '', badge: 'DON CHITO', outro: '', scenes: []} as Props}\n    calculateMetadata={calc}\n  />\n);\n",
          "src/DonChito.tsx": "import React, {useMemo} from 'react';\nimport {AbsoluteFill, Img, Sequence, staticFile, useCurrentFrame, useVideoConfig, interpolate, Easing} from 'remotion';\nimport {Chito, Pose} from './Chito';\n\nexport type Word = {t: number; w: string};\nexport type SceneP = {img: string; frames: number; text: string; words?: Word[] | null; pose?: Pose};\nexport type Props = {format: string; hook: string; badge: string; outro: string; scenes: SceneP[]};\n\nconst FONT = 'Montserrat, \"DejaVu Sans\", Arial, sans-serif';\nconst PAPER = '#f3e7cf';\nconst INK = '#2a1b10';\nconst YELLOW = '#ffd23f';\nconst RED = '#b23a26';\nconst clamp = {extrapolateLeft: 'clamp', extrapolateRight: 'clamp'} as const;\n\ntype Group = {start: number; end: number; words: Word[]};\n\nfunction groupsFor(s: SceneP, fps: number, vertical: boolean): Group[] {\n  const total = s.frames / fps;\n  let words: Word[] = (s.words || []).filter((x) => x && x.w);\n  if (!words.length) {\n    // Sin tiempos de palabra: se reparten según el largo de cada palabra.\n    const list = s.text.split(/\\s+/).filter(Boolean);\n    const chars = list.reduce((a, w) => a + w.length + 1, 0) || 1;\n    let acc = 0;\n    words = list.map((w) => {\n      const t = (acc / chars) * Math.max(0.5, total - 0.35);\n      acc += w.length + 1;\n      return {t, w};\n    });\n  }\n  const per = vertical ? 3 : 5;\n  const chunks: Word[][] = [];\n  for (let i = 0; i < words.length; i += per) chunks.push(words.slice(i, i + per));\n  if (chunks.length > 1 && chunks[chunks.length - 1].length === 1) chunks[chunks.length - 2].push(...chunks.pop()!);\n  return chunks.map((c, k) => ({start: c[0].t, end: k + 1 < chunks.length ? chunks[k + 1][0].t : total, words: c}));\n}\n\nconst Captions: React.FC<{s: SceneP; vertical: boolean}> = ({s, vertical}) => {\n  const frame = useCurrentFrame();\n  const {fps} = useVideoConfig();\n  const groups = useMemo(() => groupsFor(s, fps, vertical), [s, fps, vertical]);\n  const t = frame / fps;\n  const g = groups.find((x) => t >= x.start && t < x.end);\n  if (!g) return null;\n  const local = (t - g.start) * fps;\n  let current = 0;\n  g.words.forEach((w, i) => {\n    if (w.t <= t) current = i;\n  });\n  return (\n    <AbsoluteFill style={{justifyContent: 'flex-end', alignItems: 'center', paddingBottom: vertical ? 1010 : 70}}>\n      <div\n        style={{\n          maxWidth: vertical ? 940 : 1640,\n          textAlign: 'center',\n          fontFamily: FONT,\n          fontWeight: 900,\n          fontSize: vertical ? 82 : 62,\n          lineHeight: 1.12,\n          color: 'white',\n          textTransform: 'uppercase',\n          WebkitTextStroke: (vertical ? 14 : 9) + 'px ' + INK,\n          paintOrder: 'stroke fill',\n          textShadow: '0 6px 0 rgba(0,0,0,0.35)',\n          scale: String(interpolate(local, [0, 4], [0.86, 1], {...clamp, easing: Easing.out(Easing.back(2))})),\n        }}\n      >\n        {g.words.map((w, i) => (\n          <span key={i} style={{color: i === current ? YELLOW : 'white', display: 'inline-block', margin: '0 0.24em', scale: i === current ? '1.08' : '1'}}>\n            {w.w}\n          </span>\n        ))}\n      </div>\n    </AbsoluteFill>\n  );\n};\n\n/** Don Chito encima del fondo: habla mientras suena la voz de la escena. */\nconst ChitoLayer: React.FC<{s: SceneP; vertical: boolean}> = ({s, vertical}) => {\n  const frame = useCurrentFrame();\n  const {fps, height} = useVideoConfig();\n  const t = frame / fps;\n  const words = s.words || [];\n  const end = words.length ? words[words.length - 1].t + 0.45 : s.frames / fps - 0.35;\n  const talking = t > 0.08 && t < end;\n  const enter = interpolate(frame, [0, 8], [0.9, 1], {...clamp, easing: Easing.out(Easing.back(2))});\n  return (\n    <AbsoluteFill style={{justifyContent: 'flex-end', alignItems: vertical ? 'center' : 'flex-start', paddingLeft: vertical ? 0 : 70, paddingBottom: vertical ? 120 : 10}}>\n      <div style={{scale: String(enter), transformOrigin: 'bottom center'}}>\n        <Chito pose={s.pose || 'habla'} frame={frame} talking={talking} height={Math.round(height * (vertical ? 0.46 : 0.74))} />\n      </div>\n    </AbsoluteFill>\n  );\n};\n\nconst SceneView: React.FC<{s: SceneP; i: number; vertical: boolean}> = ({s, i, vertical}) => {\n  const frame = useCurrentFrame();\n  const zoomIn = i % 2 === 0;\n  const base = interpolate(frame, [0, s.frames], zoomIn ? [1.03, 1.13] : [1.13, 1.03], clamp);\n  // Pequeño \"golpe\" de entrada en cada corte para darle ritmo.\n  const pop = interpolate(frame, [0, 7], [0.05, 0], {...clamp, easing: Easing.out(Easing.cubic)});\n  const pan = i % 3 === 0 ? [-1.6, 1.6] : i % 3 === 1 ? [1.6, -1.6] : [0, 0];\n  const x = interpolate(frame, [0, s.frames], pan, clamp);\n  return (\n    <AbsoluteFill style={{backgroundColor: PAPER, overflow: 'hidden'}}>\n      <Img\n        src={staticFile(s.img)}\n        style={{\n          position: 'absolute',\n          inset: 0,\n          width: '100%',\n          height: '100%',\n          objectFit: 'cover',\n          objectPosition: '50% 46%',\n          scale: String(base + pop),\n          translate: `${x}% 0%`,\n        }}\n      />\n      <AbsoluteFill style={{background: 'radial-gradient(ellipse at center, rgba(0,0,0,0) 60%, rgba(60,35,15,0.28) 100%)'}} />\n      <ChitoLayer s={s} vertical={vertical} />\n      <Captions s={s} vertical={vertical} />\n    </AbsoluteFill>\n  );\n};\n\nconst Hook: React.FC<{text: string; vertical: boolean}> = ({text, vertical}) => {\n  const frame = useCurrentFrame();\n  const {fps} = useVideoConfig();\n  const inS = interpolate(frame, [0, 8], [0.6, 1], {...clamp, easing: Easing.out(Easing.back(2.2))});\n  const out = interpolate(frame, [2.3 * fps, 2.7 * fps], [1, 0], clamp);\n  return (\n    <AbsoluteFill style={{justifyContent: 'flex-start', alignItems: 'center', paddingTop: vertical ? 210 : 60, opacity: out}}>\n      <div\n        style={{\n          background: RED,\n          color: '#fff6e6',\n          fontFamily: FONT,\n          fontWeight: 900,\n          fontSize: vertical ? 84 : 62,\n          lineHeight: 1.05,\n          textTransform: 'uppercase',\n          padding: vertical ? '26px 40px' : '20px 44px',\n          borderRadius: 22,\n          border: `8px solid ${INK}`,\n          boxShadow: `0 12px 0 ${INK}`,\n          maxWidth: vertical ? 960 : 1300,\n          textAlign: 'center',\n          rotate: '-2deg',\n          scale: String(inS),\n        }}\n      >\n        {text}\n      </div>\n    </AbsoluteFill>\n  );\n};\n\nconst Badge: React.FC<{text: string; vertical: boolean}> = ({text, vertical}) => (\n  <AbsoluteFill style={{justifyContent: 'flex-start', alignItems: vertical ? 'center' : 'flex-start', padding: vertical ? '120px 0 0' : '34px 40px'}}>\n    <div\n      style={{\n        background: INK,\n        color: PAPER,\n        fontFamily: FONT,\n        fontWeight: 900,\n        letterSpacing: 3,\n        fontSize: vertical ? 40 : 30,\n        padding: '10px 22px',\n        borderRadius: 999,\n        opacity: 0.88,\n      }}\n    >\n      {text}\n    </div>\n  </AbsoluteFill>\n);\n\nconst Outro: React.FC<{text: string; vertical: boolean}> = ({text, vertical}) => {\n  const frame = useCurrentFrame();\n  const y = interpolate(frame, [0, 9], [80, 0], {...clamp, easing: Easing.out(Easing.cubic)});\n  return (\n    <AbsoluteFill style={{justifyContent: 'flex-start', alignItems: 'center', paddingTop: vertical ? 210 : 60}}>\n      <div\n        style={{\n          background: YELLOW,\n          color: INK,\n          fontFamily: FONT,\n          fontWeight: 900,\n          fontSize: vertical ? 70 : 60,\n          padding: '22px 40px',\n          borderRadius: 20,\n          border: `7px solid ${INK}`,\n          translate: `0px ${y}px`,\n          textAlign: 'center',\n          maxWidth: vertical ? 900 : 1400,\n        }}\n      >\n        {text}\n      </div>\n    </AbsoluteFill>\n  );\n};\n\nexport const DonChito: React.FC<Props> = (props) => {\n  const {fps, width, height, durationInFrames} = useVideoConfig();\n  const vertical = height > width;\n  let from = 0;\n  return (\n    <AbsoluteFill style={{backgroundColor: PAPER}}>\n      {props.scenes.map((s, i) => {\n        const at = from;\n        from += s.frames;\n        return (\n          <Sequence key={i} from={at} durationInFrames={s.frames}>\n            <SceneView s={s} i={i} vertical={vertical} />\n          </Sequence>\n        );\n      })}\n      {props.badge ? <Badge text={props.badge} vertical={vertical} /> : null}\n      {props.hook ? (\n        <Sequence from={0} durationInFrames={Math.round(2.7 * fps)}>\n          <Hook text={props.hook} vertical={vertical} />\n        </Sequence>\n      ) : null}\n      {props.outro ? (\n        <Sequence from={Math.max(0, durationInFrames - Math.round(2.4 * fps))}>\n          <Outro text={props.outro} vertical={vertical} />\n        </Sequence>\n      ) : null}\n    </AbsoluteFill>\n  );\n};\n",
          "src/Chito.tsx": "import React from 'react';\n\n// Don Chito dibujado con código: bolita, palitos, sombrero, bigote y paliacate.\n// Siempre sale igual, parpadea, mueve la boca cuando habla y cambia de pose en cada escena.\nexport type Pose = 'habla' | 'senala' | 'piensa' | 'sorprendido' | 'feliz' | 'triste' | 'trabaja' | 'camina';\nexport const POSES: Pose[] = ['habla', 'senala', 'piensa', 'sorprendido', 'feliz', 'triste', 'trabaja', 'camina'];\n\nconst INK = '#1f150d';\nconst STRAW = '#e9c46a';\nconst STRAW_DARK = '#c99a3c';\nconst RED = '#c0392b';\nconst W = 10; // grosor de línea\n\ntype P = [number, number];\nconst S: P = [200, 330]; // hombros\nconst HIP: P = [200, 480];\n\nfunction arms(pose: Pose, f: number): [P, P, P, P] {\n  const s = Math.sin(f / 5), s2 = Math.sin(f / 3.2);\n  switch (pose) {\n    case 'senala':\n      return [[160, 400], [150, 470], [285, 318], [372, 296 + 3 * s]];\n    case 'piensa':\n      return [[140, 385], [178, 425], [272, 385], [228, 272]];\n    case 'sorprendido':\n      return [[138, 272], [112 + 3 * s2, 188], [262, 272], [288 - 3 * s2, 188]];\n    case 'feliz':\n      return [[136, 285], [104, 206 + 10 * s], [264, 285], [296, 206 - 10 * s]];\n    case 'triste':\n      return [[178, 410], [176, 492], [222, 410], [224, 492]];\n    case 'trabaja':\n      return [[150, 385], [128, 440 + 22 * s2], [250, 385], [272, 440 - 22 * s2]];\n    case 'camina':\n      return [[175 + 12 * s, 405], [160 + 34 * s, 480], [225 - 12 * s, 405], [240 - 34 * s, 480]];\n    default: // habla: una mano explica, la otra abajo\n      return [[160, 400], [150, 472], [270, 352 + 6 * s], [312 + 8 * s, 300 + 14 * s]];\n  }\n}\n\nfunction legs(pose: Pose, f: number): [P, P] {\n  if (pose === 'camina') {\n    const s = Math.sin(f / 5) * 42;\n    return [[200 - s, 650], [200 + s, 650]];\n  }\n  if (pose === 'feliz' || pose === 'sorprendido') {\n    const hop = Math.max(0, Math.sin(f / 4)) * (pose === 'feliz' ? 10 : 0);\n    return [[150, 650 - hop], [250, 650 - hop]];\n  }\n  return [[155, 650], [245, 650]];\n}\n\nexport const Chito: React.FC<{pose: Pose; frame: number; talking: boolean; height: number}> = ({pose, frame, talking, height}) => {\n  const f = frame;\n  const bob = Math.sin(f / 9) * 4 + (pose === 'feliz' ? -Math.max(0, Math.sin(f / 4)) * 10 : 0);\n  const [le, lh, re, rh] = arms(pose, f);\n  const [lf, rf] = legs(pose, f);\n  const blink = f % 96 >= 90; // parpadeo\n  const open = talking ? 0.35 + 0.65 * Math.abs(Math.sin(f / 2.3)) : 0;\n  const big = pose === 'sorprendido';\n  const eyeR = big ? 11 : 8;\n  // Cejas según la emoción.\n  const brows: [P, P, P, P] =\n    pose === 'triste' ? [[160, 170], [186, 180], [214, 180], [240, 170]]\n    : pose === 'sorprendido' ? [[160, 160], [188, 154], [212, 154], [240, 160]]\n    : pose === 'piensa' ? [[160, 176], [188, 174], [212, 164], [240, 158]]\n    : pose === 'feliz' ? [[162, 172], [188, 168], [212, 168], [238, 172]]\n    : [[162, 176], [188, 174], [212, 174], [238, 176]];\n  const line = (a: P, b: P, c: P) => `M${a[0]},${a[1]} L${b[0]},${b[1]} L${c[0]},${c[1]}`;\n  let mouth: React.ReactNode;\n  if (talking) mouth = <ellipse cx={200} cy={246} rx={15} ry={3 + 11 * open} fill=\"#6b1d14\" stroke={INK} strokeWidth={5} />;\n  else if (pose === 'sorprendido') mouth = <ellipse cx={200} cy={250} rx={11} ry={13} fill=\"#6b1d14\" stroke={INK} strokeWidth={5} />;\n  else if (pose === 'triste') mouth = <path d=\"M184,254 Q200,240 216,254\" fill=\"none\" stroke={INK} strokeWidth={6} strokeLinecap=\"round\" />;\n  else mouth = <path d=\"M182,242 Q200,258 218,242\" fill=\"none\" stroke={INK} strokeWidth={6} strokeLinecap=\"round\" />;\n\n  return (\n    <svg viewBox=\"0 0 400 700\" style={{height, width: (height * 400) / 700, overflow: 'visible'}}>\n      <ellipse cx={200} cy={662} rx={110} ry={14} fill=\"rgba(0,0,0,0.18)\" />\n      <g transform={`translate(0 ${bob})`} strokeLinecap=\"round\" strokeLinejoin=\"round\">\n        {/* piernas y cuerpo */}\n        <path d={`M${lf[0]},${lf[1]} L${HIP[0]},${HIP[1]} L${rf[0]},${rf[1]}`} fill=\"none\" stroke={INK} strokeWidth={W} />\n        <path d={`M${lf[0]},${lf[1]} l-26,0 M${rf[0]},${rf[1]} l26,0`} stroke={INK} strokeWidth={W + 2} />\n        <line x1={200} y1={262} x2={HIP[0]} y2={HIP[1]} stroke={INK} strokeWidth={W} />\n        {/* brazos */}\n        <path d={line(S, le, lh)} fill=\"none\" stroke={INK} strokeWidth={W} />\n        <path d={line(S, re, rh)} fill=\"none\" stroke={INK} strokeWidth={W} />\n        <circle cx={lh[0]} cy={lh[1]} r={9} fill={INK} />\n        <circle cx={rh[0]} cy={rh[1]} r={9} fill={INK} />\n        {/* paliacate */}\n        <path d=\"M166,268 L234,268 L200,312 Z\" fill={RED} stroke={INK} strokeWidth={6} />\n        {/* cabeza */}\n        <circle cx={200} cy={192} r={76} fill=\"white\" stroke={INK} strokeWidth={W} />\n        {blink ? (\n          <>\n            <line x1={166} y1={190} x2={184} y2={190} stroke={INK} strokeWidth={6} />\n            <line x1={216} y1={190} x2={234} y2={190} stroke={INK} strokeWidth={6} />\n          </>\n        ) : (\n          <>\n            <circle cx={175} cy={190} r={eyeR} fill={INK} />\n            <circle cx={225} cy={190} r={eyeR} fill={INK} />\n            <circle cx={178} cy={187} r={2.6} fill=\"white\" />\n            <circle cx={228} cy={187} r={2.6} fill=\"white\" />\n          </>\n        )}\n        <path d={`M${brows[0][0]},${brows[0][1]} L${brows[1][0]},${brows[1][1]} M${brows[2][0]},${brows[2][1]} L${brows[3][0]},${brows[3][1]}`} stroke={INK} strokeWidth={7} />\n        {mouth}\n        {/* bigotazo */}\n        <path d=\"M200,222 C186,206 158,208 146,226 C142,236 150,244 158,236 C168,228 184,236 200,232 C216,236 232,228 242,236 C250,244 258,236 254,226 C242,208 214,206 200,222 Z\" fill={INK} />\n        {/* sombrero */}\n        <path d=\"M138,132 C134,64 160,40 200,40 C240,40 266,64 262,132 Z\" fill={STRAW} stroke={INK} strokeWidth={W} />\n        <path d=\"M140,108 L260,108 L262,128 L138,128 Z\" fill={RED} stroke={INK} strokeWidth={5} />\n        <ellipse cx={200} cy={134} rx={168} ry={26} fill={STRAW} stroke={INK} strokeWidth={W} />\n        <path d=\"M60,134 Q200,152 340,134\" fill=\"none\" stroke={STRAW_DARK} strokeWidth={5} />\n      </g>\n    </svg>\n  );\n};\n\n/** Elige la pose según lo que pasa en la escena (sin gastar IA). */\nexport function poseFor(text: string, visual: string, i: number, total: number): Pose {\n  const v = (visual + ' ' + text).toLowerCase();\n  if (i === total - 1) return 'feliz';\n  if (/point|señal|mira|look at|this is/.test(v)) return 'senala';\n  if (/think|wonder|piens|imagin|¿/.test(v) && i % 2 === 0) return 'piensa';\n  if (/surpris|shock|scared|asust|sorpren|increíble|!/.test(v)) return 'sorprendido';\n  if (/sad|worr|cry|trist|sequía|drought|sick|enferm|muri/.test(v)) return 'triste';\n  if (/walk|camin|travel|road|camino|ride|horse|caballo/.test(v)) return 'camina';\n  if (/work|milk|dig|hammer|cook|carry|plant|harvest|ordeñ|trabaj|cocin|siembr|cosech|cargar|build/.test(v)) return 'trabaja';\n  if (/happy|laugh|party|fiesta|feliz|celebr|boda|wedding/.test(v)) return 'feliz';\n  return i % 3 === 1 ? 'senala' : 'habla';\n}\n"
          };
          const KIT_DIR = process.env.REMOTION_DIR || join(WORK, 'remotion-kit');

          /** Instala Remotion la primera vez (solo cuando hay un video de Don Chito). */
          function ensureRemotion() {
            mkdirSync(join(KIT_DIR, 'src'), {recursive: true});
            for (const [name, content] of Object.entries(KIT)) writeFileSync(join(KIT_DIR, name), content);
            if (!existsSync(join(KIT_DIR, 'node_modules', '@remotion', 'cli'))) {
              log('Instalando Remotion…');
              execFileSync('npm', ['install', '--no-audit', '--no-fund', '--loglevel=error'], {cwd: KIT_DIR, stdio: 'inherit', timeout: 600000});
              execFileSync('npx', ['remotion', 'browser', 'ensure'], {cwd: KIT_DIR, stdio: 'inherit', timeout: 600000});
            }
            return KIT_DIR;
          }

          export async function renderRemotion(p) {
            const FPS = 30;
            const kit = ensureRemotion();
            const pub = join(kit, 'public', p.id);
            rmSync(pub, {recursive: true, force: true});
            mkdirSync(pub, {recursive: true});
            const work = join(WORK, p.id);
            rmSync(work, {recursive: true, force: true});
            mkdirSync(work, {recursive: true});
            const scenes = [], durations = [], segs = [];
            for (let i = 0; i < p.scenes.length; i++) {
              const s = p.scenes[i];
              if (!s.image || !s.audio || s.audio.text !== s.text) throw Error(`A la escena ${i + 1} le falta imagen o voz`);
              const ext = s.image.type === 'image/png' ? 'png' : s.image.type === 'image/webp' ? 'webp' : 'jpg';
              await download(s.image.url, join(pub, `img-${i}.${ext}`));
              const aud = await download(s.audio.url, join(work, `aud-${i}.mp3`));
              const dur = Math.min(30, Math.max(1.5, probe(aud) + 0.3));
              const frames = Math.round(dur * FPS);
              durations.push(Math.round((frames / FPS) * 100) / 100);
              scenes.push({img: `${p.id}/img-${i}.${ext}`, frames, text: s.text, words: Array.isArray(s.audio.words) ? s.audio.words : null, pose: poseFor(s.text, s.visualPrompt || '', i, p.scenes.length)});
              // Voz de la escena rellenada con silencio hasta su duración exacta.
              const seg = join(work, `seg-${i}.wav`);
              ff(['-i', aud, '-af', `aresample=48000,aformat=channel_layouts=stereo,apad,atrim=0:${(frames / FPS).toFixed(3)}`, '-c:a', 'pcm_s16le', seg]);
              segs.push(seg);
            }
            const vertical = p.format === 'Short';
            const props = {
              format: p.format,
              hook: String(p.coverTitle || p.title || '').toUpperCase().slice(0, vertical ? 40 : 55),
              badge: 'DON CHITO',
              outro: vertical ? '▶ Historia completa en el canal' : '',
              scenes,
            };
            const propsFile = join(work, 'props.json');
            writeFileSync(propsFile, JSON.stringify(props));
            const silent = join(work, 'silent.mp4');
            const t0 = Date.now();
            execFileSync('npx', ['remotion', 'render', 'src/index.ts', 'DonChito', silent, `--props=${propsFile}`, '--muted', '--codec=h264', `--crf=${vertical ? 22 : 24}`, `--concurrency=${Math.max(1, cpus().length)}`, '--log=warn'],
              {cwd: kit, stdio: 'inherit', timeout: 100 * 60000});
            log(`Remotion terminó en ${Math.round((Date.now() - t0) / 60000)} min`);
            // Pista de voz completa (normalizada) + video.
            writeFileSync(join(work, 'segs.txt'), segs.map((f) => `file '${f}'`).join('\n'));
            const voice = join(work, 'voice.m4a');
            ff(['-f', 'concat', '-safe', '0', '-i', join(work, 'segs.txt'), '-af', 'loudnorm=I=-14:TP=-1.5:LRA=9,aresample=48000', '-c:a', 'aac', '-b:a', '160k', voice]);
            let file = join(work, 'video.mp4');
            ff(['-i', silent, '-i', voice, '-map', '0:v', '-map', '1:a', '-c:v', 'copy', '-c:a', 'copy', '-shortest', '-movflags', '+faststart', file]);
            if (statSync(file).size > 90e6) {
              const smaller = join(work, 'video-small.mp4');
              ff(['-i', file, '-c:v', 'libx264', '-preset', 'veryfast', '-crf', '30', '-maxrate', '2000k', '-bufsize', '4M', '-c:a', 'copy', '-movflags', '+faststart', smaller]);
              file = smaller;
            }
            rmSync(pub, {recursive: true, force: true});
            return {file, durations};
          }

          // ---------- Armado del video con ffmpeg ----------
          const ff = (args) => execFileSync('ffmpeg', ['-hide_banner', '-loglevel', 'error', '-y', ...args], {stdio: ['ignore', 'inherit', 'inherit']});
          const probe = (file) => Number(execFileSync('ffprobe', ['-v', 'error', '-show_entries', 'format=duration', '-of', 'csv=p=0', file]).toString().trim()) || 0;

          // Palabras sin peso para elegir la palabra clave resaltada.
          const STOP = new Set('a al ante con contra de del desde el ella ellos en entre era es esa ese eso esta este esto ha hay la las le les lo los mas me mi muy nada ni no nos o para pero por que se si sin sobre su sus te tu tú un una uno unos y ya yo cuando donde como qué cómo'.split(' '));
          const assEscape = (t) => t.replace(/[{}\\]/g, '');

          function assTime(t) {
            const cs = Math.max(0, Math.round(t * 100));
            const h = Math.floor(cs / 360000), m = Math.floor(cs / 6000) % 60, s = Math.floor(cs / 100) % 60, c = cs % 100;
            return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${String(c).padStart(2, '0')}`;
          }

          /** Subtítulos estilo Short: 2-3 palabras grandes en mayúsculas, palabra clave en amarillo y entrada con "pop". */
          export function subtitleFile(text, duration, W, H, opts = {}) {
            const vertical = H > W;
            const words = text.replace(/\s+/g, ' ').trim().split(' ').filter(Boolean);
            const per = vertical ? 3 : 5, chunks = [];
            for (let i = 0; i < words.length; i += per) chunks.push(words.slice(i, i + per));
            if (chunks.length > 1 && chunks[chunks.length - 1].length === 1) chunks[chunks.length - 2].push(...chunks.pop());
            const weight = chunks.map((c) => Math.max(5, c.join(' ').length));
            const sum = weight.reduce((a, b) => a + b, 0) || 1;
            let t = 0.05;
            const events = chunks.map((c, i) => {
              const d = (duration - 0.15) * (weight[i] / sum);
              let key = -1, best = 0;
              c.forEach((w, j) => {
                const clean = w.toLowerCase().replace(/[^a-záéíóúñü0-9]/gi, '');
                if (!STOP.has(clean) && clean.length > best) { best = clean.length; key = j; }
              });
              const line = c.map((w, j) => (j === key ? `{\\c&H0000E1FF&}${assEscape(w.toUpperCase())}{\\c&H00FFFFFF&}` : assEscape(w.toUpperCase()))).join(' ');
              const ev = `Dialogue: 1,${assTime(t)},${assTime(t + d)},Main,,0,0,0,,{\\fscx82\\fscy82\\t(0,110,\\fscx100\\fscy100)}${line}`;
              t += d;
              return ev;
            });
            if (opts.hook) {
              // Frase gancho grande al inicio para detener el scroll.
              events.unshift(`Dialogue: 2,${assTime(0)},${assTime(Math.min(2.8, duration))},Hook,,0,0,0,,{\\fad(80,250)\\fscx90\\fscy90\\t(0,140,\\fscx100\\fscy100)}${assEscape(opts.hook.toUpperCase())}`);
            }
            return [
              '[Script Info]', 'ScriptType: v4.00+', `PlayResX: ${W}`, `PlayResY: ${H}`, 'WrapStyle: 0', '',
              '[V4+ Styles]',
              'Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding',
              `Style: Main,Montserrat,${vertical ? 96 : 72},&H00FFFFFF,&H00FFFFFF,&H00000000,&H96000000,-1,0,0,0,100,100,1,0,1,${vertical ? 8 : 6},3,2,70,70,${vertical ? 620 : 140},1`,
              `Style: Hook,Montserrat,${vertical ? 124 : 88},&H00FFFFFF,&H00FFFFFF,&H00000000,&HB4101010,-1,0,0,0,100,100,1,0,3,${vertical ? 18 : 14},0,8,70,70,${vertical ? 300 : 90},1`,
              '', '[Events]', 'Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text', ...events, '',
            ].join('\n');
          }

          /** Movimiento de cámara con "punch-in" a la mitad de la escena para darle ritmo (un corte sin cambiar de imagen). */
          export function motion(i, frames) {
            const N = Math.max(1, frames - 1), half = Math.round(N / 2);
            const zoomIn = i % 3 !== 1;
            const base = zoomIn ? `1.0+0.16*on/${N}` : `1.16-0.16*on/${N}`;
            const z = `${base}+if(gte(on\\,${half})\\,0.10\\,0)`;
            const dir = i % 2 === 0 ? 1 : -1;
            const x = `(iw-iw/zoom)/2+${dir}*(iw-iw/zoom)/2*0.55*(2*on/${N}-1)`;
            const y = i % 3 === 0 ? `(ih-ih/zoom)/2+(ih-ih/zoom)/2*0.45*(2*on/${N}-1)` : `(ih-ih/zoom)*0.42`;
            return {z, x, y};
          }

          /** Índice de la escena del giro (para el destello y el golpe de sonido). */
          export function twistIndex(p) {
            const n = p.scenes.length;
            const byRole = p.scenes.findIndex((s) => s.role === 'CAMBIO DE RITMO');
            return byRole > 0 ? byRole : Math.max(1, n - 2);
          }

          export async function render(p, fetchAssets = true) {
            const W = p.format === 'Short' ? 1080 : 1920, H = p.format === 'Short' ? 1920 : 1080, FPS = 30;
            const horror = p.voiceStyle === 'suspense' || p.research?.mode === 'fiction' || p.productionSettings?.mode === 'fiction';
            const dir = join(WORK, p.id);
            rmSync(dir, {recursive: true, force: true});
            mkdirSync(dir, {recursive: true});
            const clips = [], durations = [];
            const twist = twistIndex(p);
            const hook = String(p.coverTitle || p.title || '').slice(0, 55);
            for (let i = 0; i < p.scenes.length; i++) {
              const s = p.scenes[i];
              const img = join(dir, `img-${i}.jpg`), aud = join(dir, `aud-${i}.mp3`);
              if (fetchAssets) {
                if (s.image) await download(s.image.url, img);
                if (s.audio && s.audio.text === s.text) await download(s.audio.url, aud);
              }
              const hasImg = !!s.image, hasAud = !!(s.audio && s.audio.text === s.text);
              const audioLen = hasAud ? probe(aud) : 0;
              // Ritmo: la escena dura lo que dura la voz + un respiro corto (no se estira al tiempo sugerido).
              const dur = Math.min(30, Math.max(1.5, hasAud ? audioLen + 0.25 : Number(s.duration) || 4));
              durations.push(Math.round(dur * 100) / 100);
              const frames = Math.round(dur * FPS);
              writeFileSync(join(dir, `sub-${i}.ass`), subtitleFile(s.text, dur, W, H, i === 0 && hook ? {hook} : {}));
              const m = motion(i, frames);
              const fadeOut = Math.max(0, dur - 0.18).toFixed(2);
              const look = horror ? 'eq=saturation=0.82:contrast=1.06:brightness=0.03:gamma=1.12,colorbalance=bs=0.05:bm=0.02,vignette=PI/5.5,noise=alls=5:allf=t,' : 'eq=contrast=1.04:saturation=1.05,';
              const flash = i === twist ? 'fade=t=in:st=0:d=0.22:color=white,' : 'fade=t=in:st=0:d=0.15,';
              const video = hasImg
                ? `[0:v]scale=${W * 2}:${H * 2}:force_original_aspect_ratio=increase,crop=${W * 2}:${H * 2},setsar=1,` +
                  `zoompan=z='${m.z}':x='${m.x}':y='${m.y}':d=${frames}:s=${W}x${H}:fps=${FPS},`
                : `[0:v]`;
              const filter =
                video + look +
                `format=yuv420p,subtitles=sub-${i}.ass,${flash}fade=t=out:st=${fadeOut}:d=0.18[v];` +
                `[1:a]aresample=48000,aformat=channel_layouts=stereo,apad,atrim=0:${dur.toFixed(2)},loudnorm=I=-14:TP=-1.5:LRA=9,aresample=48000[a]`;
              const inputs = hasImg ? ['-i', img] : ['-f', 'lavfi', '-i', `color=c=0x0b0d10:s=${W}x${H}:r=${FPS}:d=${dur.toFixed(2)}`];
              const audioIn = hasAud ? ['-i', aud] : ['-f', 'lavfi', '-i', 'anullsrc=r=48000:cl=stereo'];
              const out = join(dir, `clip-${i}.mp4`);
              execFileSync('ffmpeg', ['-hide_banner', '-loglevel', 'error', '-y', ...inputs, ...audioIn, '-filter_complex', filter, '-map', '[v]', '-map', '[a]',
                '-t', dur.toFixed(2), '-r', String(FPS), '-c:v', 'libx264', '-preset', 'veryfast', '-crf', p.format === 'Short' ? '23' : '24',
                '-maxrate', p.format === 'Short' ? '6M' : '4M', '-bufsize', '12M', '-pix_fmt', 'yuv420p', '-c:a', 'aac', '-b:a', '160k', '-ar', '48000', out],
                {cwd: dir, stdio: ['ignore', 'inherit', 'inherit']});
              clips.push(out);
            }
            writeFileSync(join(dir, 'list.txt'), clips.map((c) => `file '${c}'`).join('\n'));
            let file = join(dir, 'video.mp4');
            ff(['-f', 'concat', '-safe', '0', '-i', join(dir, 'list.txt'), '-c', 'copy', '-movflags', '+faststart', file]);

            // Capa de sonido: ambiente (si está activo) + "swoosh" en cada corte + golpe grave en el giro. Todo generado aquí, sin material de terceros.
            const D = durations.reduce((a, b) => a + b, 0);
            const starts = durations.map((_, i) => durations.slice(0, i).reduce((a, b) => a + b, 0));
            const inputs = ['-i', file];
            const parts = [];
            let n = 1;
            if (p.music) {
              const end = Math.max(0, D - 2.5).toFixed(2);
              inputs.push('-f', 'lavfi', '-i', `anoisesrc=d=${D.toFixed(2)}:c=brown:a=0.5,lowpass=f=260,highpass=f=35`, '-f', 'lavfi', '-i', `sine=f=55:d=${D.toFixed(2)}`, '-f', 'lavfi', '-i', `sine=f=82.4:d=${D.toFixed(2)}`);
              parts.push(`[${n}:a]volume=0.35[n0];[${n + 1}:a]volume=0.10,tremolo=f=0.15:d=0.7[n1];[${n + 2}:a]volume=0.06,tremolo=f=0.11:d=0.8[n2];` +
                `[n0][n1][n2]amix=inputs=3:normalize=0,aformat=channel_layouts=stereo,afade=t=in:st=0:d=2,afade=t=out:st=${end}:d=2.5,volume=2.6[amb]`);
              n += 3;
            }
            const sfx = [];
            starts.slice(1).forEach((st, k) => {
              if (k + 1 === twist) return;
              inputs.push('-f', 'lavfi', '-i', 'anoisesrc=d=0.45:c=pink:a=0.6');
              sfx.push(`[${n}:a]highpass=f=900,lowpass=f=6000,afade=t=in:st=0:d=0.22,afade=t=out:st=0.22:d=0.23,volume=0.16,aformat=channel_layouts=stereo,adelay=${Math.max(0, Math.round((st - 0.2) * 1000))}:all=1[w${k}]`);
              n++;
            });
            if (twist < starts.length) {
              inputs.push('-f', 'lavfi', '-i', 'sine=f=48:d=1.6', '-f', 'lavfi', '-i', 'anoisesrc=d=0.25:c=brown:a=0.9');
              sfx.push(`[${n}:a]afade=t=out:st=0:d=1.6,volume=1.1[bs];[${n + 1}:a]lowpass=f=180,afade=t=out:st=0:d=0.25,volume=0.9[bn];[bs][bn]amix=inputs=2:normalize=0,aformat=channel_layouts=stereo,adelay=${Math.round(starts[twist] * 1000)}:all=1[boom]`);
              n += 2;
            }
            const layers = [...(p.music ? ['[amb]'] : []), ...sfx.map((s) => s.match(/\[(\w+)\]$/)[1]).map((l) => `[${l}]`)];
            if (layers.length) {
              const withFx = join(dir, 'video-final.mp4');
              const graph = [...parts, ...sfx,
                `${layers.join('')}amix=inputs=${layers.length}:normalize=0,apad,atrim=0:${D.toFixed(2)}[bed]`,
                `[0:a][bed]amix=inputs=2:duration=first:normalize=0,alimiter=limit=0.95[a]`].join(';');
              ff([...inputs, '-filter_complex', graph, '-map', '0:v', '-map', '[a]', '-c:v', 'copy', '-c:a', 'aac', '-b:a', '160k', '-movflags', '+faststart', withFx]);
              file = withFx;
            }
            if (statSync(file).size > 90e6) {
              const smaller = join(dir, 'video-small.mp4');
              ff(['-i', file, '-c:v', 'libx264', '-preset', 'veryfast', '-crf', '28', '-maxrate', '2500k', '-bufsize', '5M', '-c:a', 'copy', '-movflags', '+faststart', smaller]);
              return {file: smaller, durations};
            }
            return {file, durations};
          }

          const log = (m) => console.log(new Date().toISOString().slice(11, 19) + ' ' + m);

          async function main() {
            const next = await api('robot/next', {});
            if (next.action !== 'produce') { log('Nada que hacer: ' + next.reason); return; }
            const p = next.project;
            log('Produciendo: ' + p.topic);
            try {
              await produce(p);
              log('Listo. El video espera tu aprobación en la app.');
            } catch (e) {
              log('Error: ' + e.message);
              await api('robot/report', {id: p.id, error: e.message}).catch(() => {});
              process.exitCode = 1;
            }
          }

          if (process.argv[1] && import.meta.url.endsWith(process.argv[1].split('/').pop())) await main();
          ROBOT_EOF
          node robot.mjs
