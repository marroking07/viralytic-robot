name: Autopiloto Viralytic

on:
  schedule:
    - cron: '17 0,12 * * *'   # cada 12 horas (6:17 am y 6:17 pm en México) revisa si toca producir un video
  workflow_dispatch: {}       # botón "Run workflow" para probar a mano

permissions:
  id-token: write   # para que tu app reconozca a este robot sin contraseñas
  contents: read

concurrency:
  group: autopiloto
  cancel-in-progress: false

jobs:
  producir:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar ffmpeg y voces gratis (edge-tts)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
          sudo apt-get install -y -qq fonts-montserrat > /dev/null || true
          pip install -q edge-tts
      - name: Recordar Remotion entre corridas
        uses: actions/cache@v4
        with:
          path: /tmp/remotion-kit/node_modules
          key: remotion-4.0.528-v1
      - name: Producir video
        env:
          APP_URL: https://viralytic-ai.pll-studio.workers.dev
          REMOTION_DIR: /tmp/remotion-kit
        run: |
          cat > robot.mjs <<'ROBOT_EOF'
          // Robot del autopiloto de Viralytic AI.
          // Corre en GitHub Actions: pide a tu app el siguiente video, genera guion/imágenes con tu app,
          // la voz con edge-tts (gratis) y arma el MP4 (MARRO con ffmpeg, Don Chito con Remotion).
          // Lo deja "LISTO PARA REVISIÓN". Nunca publica: tú apruebas en la app.
          import {execFileSync} from 'node:child_process';
          import {mkdirSync, writeFileSync, readFileSync, statSync, rmSync, existsSync} from 'node:fs';
          import {join} from 'node:path';
          import {createHash} from 'node:crypto';
          import {cpus} from 'node:os';

          const APP = (process.env.APP_URL || '').replace(/\/$/, '');
          const WORK = process.env.WORK_DIR || '/tmp/viralytic';
          if (!APP) throw Error('Falta APP_URL');

          // ---------- Acceso: token de identidad de GitHub (OIDC) o token fijo ----------
          let cached = {value: '', at: 0};
          async function credential() {
            if (process.env.ROBOT_TOKEN) return process.env.ROBOT_TOKEN;
            if (cached.value && Date.now() - cached.at < 120000) return cached.value;
            const url = process.env.ACTIONS_ID_TOKEN_REQUEST_URL, token = process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
            if (!url || !token) throw Error('GitHub no entregó el token de identidad. Revisa "permissions: id-token: write".');
            const r = await fetch(url + '&audience=viralytic-ai', {headers: {Authorization: 'bearer ' + token}});
            if (!r.ok) throw Error('No se pudo obtener el token de GitHub (' + r.status + ')');
            cached = {value: (await r.json()).value, at: Date.now()};
            return cached.value;
          }

          async function request(path, init = {}, tries = 3) {
            for (let attempt = 1; ; attempt++) {
              let r;
              try {
                r = await fetch(APP + '/api/' + path, {
                  ...init,
                  headers: {Authorization: 'Bearer ' + (await credential()), ...(init.headers || {})},
                  signal: AbortSignal.timeout(330000),
                });
              } catch (e) {
                if (attempt < tries) { await sleep(5000 * attempt); continue; }
                throw Error('Sin conexión con la app en ' + path + ': ' + e.message);
              }
              if (r.status >= 500 && r.status !== 503 && attempt < tries) { await sleep(5000 * attempt); continue; }
              return r;
            }
          }
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

          async function api(path, body) {
            const r = await request(path, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body || {})});
            const j = await r.json().catch(() => ({}));
            if (!r.ok) throw Error(j.error || path + ' respondió ' + r.status);
            return j;
          }
          async function download(url, file) {
            const r = await request(url.replace(/^\/api\//, ''));
            if (!r.ok) throw Error('No se pudo descargar ' + url);
            writeFileSync(file, Buffer.from(await r.arrayBuffer()));
            return file;
          }

          // ---------- Voz gratis con edge-tts (voces de Microsoft) ----------
          let edgeBroken = false;
          const EDGE_PY = `
          import asyncio, sys, json, edge_tts
          async def main(text, voice, rate, pitch, out, words):
              try:
                  c = edge_tts.Communicate(text, voice, rate=rate, pitch=pitch, boundary="WordBoundary")
              except TypeError:
                  c = edge_tts.Communicate(text, voice, rate=rate, pitch=pitch)
              ws = []
              with open(out, "wb") as f:
                  async for ch in c.stream():
                      if ch["type"] == "audio":
                          f.write(ch["data"])
                      elif ch["type"] == "WordBoundary":
                          ws.append({"t": round(ch["offset"] / 1e7, 3), "w": ch["text"]})
              with open(words, "w", encoding="utf-8") as f:
                  json.dump(ws, f, ensure_ascii=False)
          asyncio.run(main(*sys.argv[1:]))
          `;

          /** Genera la voz de una escena con edge-tts y la sube a la app (con los tiempos de cada palabra para los subtítulos). */
          async function edgeVoice(p, i, {rate = '+0%', pitch = '+0Hz'} = {}) {
            const dir = join(WORK, 'tts');
            mkdirSync(dir, {recursive: true});
            const py = join(dir, 'edge.py');
            if (!existsSync(py)) writeFileSync(py, EDGE_PY);
            const text = p.scenes[i].text, voice = p.channel === 'donchito' ? 'es-MX-JorgeNeural' : p.edgeVoice || 'es-MX-JorgeNeural';
            const out = join(dir, `${p.id}-${i}.mp3`), words = join(dir, `${p.id}-${i}.json`);
            let last;
            for (let attempt = 1; attempt <= 3; attempt++) {
              try {
                execFileSync('python3', [py, text, voice, rate, pitch, out, words], {stdio: ['ignore', 'ignore', 'pipe'], timeout: 120000});
                if (statSync(out).size > 1000) { last = null; break; }
                last = Error('audio vacío');
              } catch (e) {
                last = Error(String(e.stderr || e.message).trim().split('\n').pop());
              }
              await sleep(3000 * attempt);
            }
            if (last) throw last;
            let w = '';
            try {
              const b64 = Buffer.from(readFileSync(words, 'utf8')).toString('base64');
              if (b64.length < 7500) w = b64;
            } catch {}
            const r = await request('audio-upload', {
              method: 'POST',
              headers: {
                'Content-Type': 'audio/mpeg',
                'X-Project-Id': p.id,
                'X-Scene-Index': String(i),
                'X-Scene-Hash': createHash('sha256').update(text).digest('hex'),
                'X-Voice-Engine': 'edge-tts',
                'X-Voice-Id': voice,
                ...(w ? {'X-Words': w} : {}),
              },
              body: readFileSync(out),
            });
            const j = await r.json().catch(() => ({}));
            if (!r.ok) throw Error(j.error || 'La app no aceptó la voz');
            return j;
          }

          // ---------- Producción con la IA de tu app ----------
          async function produce(p) {
            if (p.channel === 'donchito') return produceDonChito(p);
            const id = p.id;
            const total = () => p.scenes.length * 2 + 3;
            let done = 0;
            const step = (stage, message, scene) =>
              api('production-state', {id, progress: {stage, message: 'Autopiloto · ' + message, scene, total: p.scenes.length, done, steps: total(), status: 'running'}}).catch(() => {});

            if (!p.autopilot?.scriptDone) {
              await step('script', 'escribiendo el guion');
              p = await api('ai-script', {id, brief: p.brief || ''});
              p = await api('robot/report', {id, scriptDone: true});
              log('Guion listo: ' + p.title + ' (' + p.scenes.length + ' escenas)');
            }
            await step('direction', 'eligiendo voz y estilo');
            p = await api('ai-direction', {id, force: false});
            done++;
            const voice = p.aiVoice || 'marin', style = p.voiceStyle || 'explainer';
            for (let i = 0; i < p.scenes.length; i++) {
              if (!p.scenes[i].image) {
                await step('image', `imagen ${i + 1} de ${p.scenes.length}`, i + 1);
                p = await api('ai-image', {id, index: i, prompt: p.scenes[i].visualPrompt || '', force: false});
              }
              done++;
              const a = p.scenes[i].audio;
              const edge = p.voiceEngine === 'edge' && !edgeBroken;
              const wanted = edge ? 'Edge · ' + (p.edgeVoice || 'es-MX-JorgeNeural') : 'Voz IA · ' + voice;
              if (!a || a.text !== p.scenes[i].text || a.voice !== wanted || (!edge && a.style !== style)) {
                await step('voice', `voz ${i + 1} de ${p.scenes.length}`, i + 1);
                let ok = false;
                if (edge) {
                  try {
                    p = await edgeVoice(p, i, {rate: '-6%', pitch: '-4Hz'});
                    ok = true;
                  } catch (e) {
                    edgeBroken = true;
                    log('edge-tts falló, se usa la voz de OpenAI: ' + e.message);
                  }
                }
                if (!ok) p = await api('voice', {id, index: i, voice, voiceStyle: style, force: false});
              }
              done++;
              log(`Escena ${i + 1}/${p.scenes.length} lista`);
            }
            if (!p.thumbnailImage && !codeBg) {
              await step('thumbnail', 'creando la portada');
              p = await api('ai-thumbnail', {id, title: p.coverTitle || p.title, prompt: p.coverPrompt || ''});
            }
            done++;
            await step('render', 'armando el video');
            const job = await api('render', {id});
            const {file, durations} = await render(job);
            log('Video armado: ' + (statSync(file).size / 1e6).toFixed(1) + ' MB');
            const r = await request('video', {
              method: 'POST',
              headers: {
                'Content-Type': 'video/mp4',
                'X-Project-Id': id,
                'X-Render-Token': job.renderToken,
                'X-Scene-Durations': JSON.stringify(durations),
              },
              body: readFileSync(file),
            });
            const result = await r.json().catch(() => ({}));
            if (!r.ok) throw Error(result.error || 'La app no aceptó el video');
            await api('production-state', {id, progress: {stage: 'complete', message: 'Autopiloto · listo para tu aprobación', total: p.scenes.length, done: total(), steps: total(), status: 'complete'}}).catch(() => {});
            return result;
          }

          // ---------- Fondos dibujados con código (estilo bolitas y palitos, igual que Don Chito) ----------
          // sceneSVG(set, cast, {w, h}) devuelve un SVG completo. Gratis, sin cuotas y siempre con el mismo estilo.
          // set = {lugar, hora, cosas:[], personajes:[{name, pose}]}; cast = [{name, kind, color, hat}]
          const BG_LUGARES = ['rancho', 'arroyo', 'fogata', 'panteon', 'milpa', 'camino', 'cerro', 'pozo', 'hacienda', 'cocina', 'capilla', 'rio', 'monte', 'corral', 'pueblo', 'nave'];
          const BG_HORAS = ['noche', 'atardecer', 'dia', 'amanecer'];
          const BG_COSAS = ['luna', 'estrellas', 'niebla', 'linterna', 'veladora', 'fogata', 'perro', 'caballo', 'vaca', 'gallina', 'lechuza', 'arbol', 'nopal', 'cruz', 'piedra', 'carreta', 'ventana', 'lluvia', 'huellas', 'olla', 'comal', 'cazuela', 'carne', 'chiles', 'cebolla', 'ajo', 'tortillas', 'plato', 'ovni'];
          const BG_TIPOS = ['hombre', 'mujer', 'nino', 'nina', 'anciano', 'anciana', 'llorona', 'charro_negro', 'sombra', 'nahual', 'jinete_sin_cabeza', 'fantasma', 'curandera', 'extraterrestre'];
          const BG_POSES = ['parado', 'camina', 'asustado', 'senala', 'llora', 'flota', 'corre', 'sentado', 'reza'];

          const INK = '#1f150d';
          const COLORS = {rojo: '#c0392b', azul: '#2f6db5', verde: '#3f8f4f', amarillo: '#e9b949', blanco: '#f4f1ea', negro: '#1b1b1b', cafe: '#8a5a2b', morado: '#7b4ea3', rosa: '#d9789a', gris: '#8d8d8d', naranja: '#e07b2e'};
          const col = (c, d) => COLORS[String(c || '').toLowerCase()] || (/^#[0-9a-f]{6}$/i.test(String(c)) ? c : d);

          function hash(s) {
            let h = 2166136261;
            for (const ch of String(s)) h = Math.imul(h ^ ch.charCodeAt(0), 16777619);
            return h >>> 0;
          }
          function rng(seed) {
            let a = seed || 1;
            return () => ((a = Math.imul(a ^ (a >>> 15), a | 1) ^ (a + Math.imul(a ^ (a >>> 7), a | 61))), ((a ^ (a >>> 14)) >>> 0) / 4294967296);
          }

          const SKY = {
            noche: ['#141033', '#2b1f57', '#4a2f6e'],
            atardecer: ['#3a2a6e', '#c4566b', '#f2a65a'],
            dia: ['#8fd3f4', '#bfe6f7', '#f3ecd3'],
            amanecer: ['#4b5d9c', '#e79a7b', '#f7d7a0'],
          };
          const GROUND = {noche: ['#2d2347', '#211a37'], atardecer: ['#7a4a52', '#5a3542'], dia: ['#d9b77a', '#c99f5f'], amanecer: ['#a87a6a', '#8a5f55']};

          // ---------- piezas ----------
          const nopal = (x, y, s, c) => `<g transform="translate(${x} ${y}) scale(${s})" fill="${c}" stroke="${INK}" stroke-width="4"><ellipse cx="0" cy="-60" rx="22" ry="36"/><ellipse cx="-26" cy="-108" rx="16" ry="26" transform="rotate(-25 -26 -108)"/><ellipse cx="24" cy="-112" rx="15" ry="24" transform="rotate(20 24 -112)"/><ellipse cx="0" cy="-130" rx="14" ry="22"/></g>`;
          const tree = (x, y, s, c, leaf) => `<g transform="translate(${x} ${y}) scale(${s})" stroke="${INK}" stroke-width="5" stroke-linecap="round"><path d="M0,0 L0,-120 M0,-80 L-40,-130 M0,-95 L38,-140 M-20,-105 L-45,-115" fill="none" stroke="${c}"/><path d="M0,0 L0,-120 M0,-80 L-40,-130 M0,-95 L38,-140" fill="none" stroke="${INK}" stroke-width="2"/>${leaf ? `<ellipse cx="-30" cy="-140" rx="40" ry="22" fill="${leaf}"/><ellipse cx="30" cy="-150" rx="42" ry="24" fill="${leaf}"/><ellipse cx="0" cy="-165" rx="38" ry="22" fill="${leaf}"/>` : ''}</g>`;
          const adobe = (x, y, s, wall, glow) => `<g transform="translate(${x} ${y}) scale(${s})" stroke="${INK}" stroke-width="5" stroke-linejoin="round"><rect x="0" y="-150" width="260" height="150" fill="${wall}"/><rect x="-14" y="-168" width="288" height="22" fill="#9a6b44"/><rect x="104" y="-92" width="52" height="92" fill="#5b3a22"/><rect x="28" y="-110" width="44" height="40" fill="${glow ? '#ffbf55' : '#3c2a3a'}"/><rect x="188" y="-110" width="44" height="40" fill="${glow ? '#ffbf55' : '#3c2a3a'}"/>${[20, 70, 120, 170, 220].map((v) => `<circle cx="${v}" cy="-157" r="5" fill="#5b3a22"/>`).join('')}</g>`;
          const fence = (x1, x2, y, c) => {
            let g = `<g stroke="${INK}" stroke-width="5" stroke-linecap="round"><path d="M${x1},${y - 45} L${x2},${y - 45} M${x1},${y - 20} L${x2},${y - 20}" stroke="${c}" stroke-width="9"/>`;
            for (let x = x1; x <= x2; x += 70) g += `<rect x="${x - 7}" y="${y - 70}" width="14" height="72" fill="${c}"/>`;
            return g + '</g>';
          };
          const campfire = (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s})" stroke="${INK}" stroke-width="5" stroke-linejoin="round"><circle cx="0" cy="-40" r="90" fill="#ffb347" opacity="0.18" stroke="none"/><path d="M-50,0 L50,-18 M-50,-18 L50,0" stroke="#7a4a24" stroke-width="16"/><path d="M-30,-10 C-38,-50 -8,-60 -4,-96 C14,-66 34,-56 30,-10 Z" fill="#f28b2c"/><path d="M-12,-10 C-16,-36 2,-44 4,-66 C14,-46 22,-36 16,-10 Z" fill="#ffd166" stroke-width="3"/></g>`;
          const cross = (x, y, s, c) => `<g transform="translate(${x} ${y}) scale(${s})" fill="${c}" stroke="${INK}" stroke-width="4"><rect x="-7" y="-80" width="14" height="80"/><rect x="-28" y="-62" width="56" height="13"/></g>`;
          const tomb = (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s})" fill="#8d8a9c" stroke="${INK}" stroke-width="4"><path d="M-30,0 L-30,-55 Q0,-85 30,-55 L30,0 Z"/></g>`;
          const well = (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s})" stroke="${INK}" stroke-width="5"><rect x="-60" y="-60" width="120" height="60" fill="#9a8f84"/><path d="M-60,-40 L60,-40 M-20,-60 L-20,0 M25,-60 L25,0" stroke="#6f655c" stroke-width="3"/><path d="M-50,-60 L-50,-150 M50,-60 L50,-150 M-62,-150 L62,-150" stroke="#7a4a24" stroke-width="10" fill="none"/><path d="M0,-150 L0,-100" stroke="${INK}"/><rect x="-12" y="-102" width="24" height="22" fill="#7a4a24"/></g>`;
          const corn = (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s})" stroke="${INK}" stroke-width="4" stroke-linecap="round"><path d="M0,0 L0,-150" stroke="#5f8f3a" stroke-width="7"/><path d="M0,-40 Q-40,-70 -55,-55 M0,-70 Q40,-100 55,-85 M0,-100 Q-35,-130 -48,-118 M0,-130 Q30,-160 40,-150" fill="none" stroke="#6fa543" stroke-width="7"/><ellipse cx="10" cy="-85" rx="8" ry="20" fill="#e9c46a"/></g>`;
          const chapel = (x, y, s, glow) => `<g transform="translate(${x} ${y}) scale(${s})" stroke="${INK}" stroke-width="5" stroke-linejoin="round"><rect x="-90" y="-170" width="180" height="170" fill="#e8d9bf"/><path d="M-90,-170 L0,-240 L90,-170 Z" fill="#c9a77a"/><rect x="-22" y="-300" width="44" height="70" fill="#e8d9bf"/><path d="M0,-345 L0,-300 M-15,-330 L15,-330" stroke-width="7"/><path d="M-30,0 L-30,-80 Q0,-115 30,-80 L30,0 Z" fill="#5b3a22"/><circle cx="0" cy="-200" r="16" fill="${glow ? '#ffbf55' : '#3c2a3a'}"/></g>`;
          const hacienda = (x, y, s, glow) => `<g transform="translate(${x} ${y}) scale(${s})" stroke="${INK}" stroke-width="5" stroke-linejoin="round"><rect x="0" y="-200" width="420" height="200" fill="#d9b48a"/><rect x="-16" y="-220" width="452" height="26" fill="#a0523d"/>${[30, 120, 300, 370].map((v) => `<rect x="${v}" y="-150" width="40" height="56" fill="${glow ? '#ffbf55' : '#3c2a3a'}"/>`).join('')}<path d="M170,0 L170,-110 Q210,-160 250,-110 L250,0 Z" fill="#5b3a22"/></g>`;
          const cart = (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s})" stroke="${INK}" stroke-width="5"><rect x="-90" y="-80" width="180" height="40" fill="#9a6b44"/><circle cx="-50" cy="-30" r="30" fill="none" stroke-width="7"/><circle cx="50" cy="-30" r="30" fill="none" stroke-width="7"/><path d="M-50,-30 L-50,-60 M50,-30 L50,-60 M90,-60 L150,-40" stroke-width="5"/></g>`;
          const rock = (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s})" stroke="${INK}" stroke-width="4"><path d="M-40,0 Q-45,-30 -10,-38 Q30,-45 40,-15 L42,0 Z" fill="#8a8173"/></g>`;
          const lantern = (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s})" stroke="${INK}" stroke-width="4"><circle cx="0" cy="-30" r="60" fill="#ffbf55" opacity="0.22" stroke="none"/><path d="M-14,0 L-14,-46 L14,-46 L14,0 Z" fill="#ffd27a"/><path d="M-18,-46 L18,-46 L0,-62 Z M-6,-62 Q0,-76 6,-62" fill="#3c2a3a"/></g>`;
          const candle = (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s})" stroke="${INK}" stroke-width="3"><circle cx="0" cy="-40" r="34" fill="#ffbf55" opacity="0.25" stroke="none"/><rect x="-9" y="-36" width="18" height="36" fill="#f4f1ea"/><path d="M0,-36 C-8,-50 0,-60 0,-66 C6,-56 8,-48 0,-36 Z" fill="#ffb347"/></g>`;
          const owl = (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s})" stroke="${INK}" stroke-width="4"><ellipse cx="0" cy="-30" rx="24" ry="32" fill="#9a8f84"/><path d="M-22,-56 L-14,-70 L-6,-58 M22,-56 L14,-70 L6,-58" fill="#9a8f84"/><circle cx="-9" cy="-42" r="8" fill="#ffd166"/><circle cx="9" cy="-42" r="8" fill="#ffd166"/><circle cx="-9" cy="-42" r="3" fill="${INK}"/><circle cx="9" cy="-42" r="3" fill="${INK}"/><path d="M-4,-32 L0,-26 L4,-32" fill="#e9b949"/></g>`;
          const dog = (x, y, s, c, eyes) => `<g transform="translate(${x} ${y}) scale(${s})" stroke="${INK}" stroke-width="4" stroke-linecap="round"><ellipse cx="0" cy="-45" rx="45" ry="20" fill="${c}"/><circle cx="48" cy="-62" r="17" fill="${c}"/><path d="M58,-74 L64,-90 L52,-78" fill="${c}"/><path d="M-30,-30 L-34,0 M-10,-30 L-12,0 M20,-30 L22,0 M36,-30 L40,0 M-44,-50 L-66,-66" fill="none" stroke-width="6"/><circle cx="54" cy="-64" r="3.5" fill="${eyes || INK}" stroke="none"/></g>`;
          const horse = (x, y, s, c, eyes) => `<g transform="translate(${x} ${y}) scale(${s})" stroke="${INK}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="0" cy="-90" rx="70" ry="32" fill="${c}"/><path d="M55,-105 L90,-160 L118,-150 L84,-96 Z" fill="${c}"/><path d="M-45,-70 L-50,0 M-20,-65 L-22,0 M25,-65 L28,0 M50,-70 L56,0 M-70,-95 Q-100,-70 -92,-40" fill="none" stroke-width="8"/><path d="M80,-158 L74,-176 L90,-162" fill="${c}"/><circle cx="104" cy="-150" r="4" fill="${eyes || INK}" stroke="none"/></g>`;
          const cow = (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s})" stroke="${INK}" stroke-width="5" stroke-linecap="round"><ellipse cx="0" cy="-80" rx="70" ry="34" fill="#f4f1ea"/><ellipse cx="-20" cy="-88" rx="18" ry="12" fill="${INK}"/><circle cx="76" cy="-96" r="26" fill="#f4f1ea"/><path d="M62,-120 L56,-134 M90,-120 L96,-134" stroke-width="6"/><path d="M-45,-55 L-48,0 M-15,-50 L-15,0 M20,-50 L22,0 M45,-55 L48,0" stroke-width="8"/><circle cx="84" cy="-98" r="3.5" fill="${INK}" stroke="none"/></g>`;
          const hen = (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s})" stroke="${INK}" stroke-width="4"><ellipse cx="0" cy="-30" rx="26" ry="22" fill="#f4f1ea"/><circle cx="22" cy="-52" r="12" fill="#f4f1ea"/><path d="M18,-64 Q22,-74 28,-64" fill="${COLORS.rojo}"/><path d="M33,-52 L42,-48 L33,-45" fill="#e9b949"/><path d="M-6,-8 L-8,4 M8,-8 L10,4"/></g>`;

          // ---------- ovnis ----------
          const ufo = (x, y, s, beamTo) => `<g stroke="${INK}" stroke-linejoin="round">${beamTo ? `<path d="M${x - 70 * s},${y + 20 * s} L${x + 70 * s},${y + 20 * s} L${x + 230 * s},${beamTo} L${x - 230 * s},${beamTo} Z" fill="#b8ffcf" opacity="0.32" stroke="none"/><ellipse cx="${x}" cy="${beamTo}" rx="${230 * s}" ry="${30 * s}" fill="#b8ffcf" opacity="0.35" stroke="none"/>` : ''}<g transform="translate(${x} ${y}) scale(${s})" stroke-width="6"><circle cx="0" cy="-10" r="190" fill="#b8ffcf" opacity="0.10" stroke="none"/><path d="M-70,-28 Q-66,-96 0,-100 Q66,-96 70,-28 Z" fill="#a8e6ff"/><path d="M-36,-70 Q-20,-88 0,-88" fill="none" stroke="#ffffff" stroke-width="7"/><ellipse cx="0" cy="-14" rx="170" ry="40" fill="#9aa3b5"/><ellipse cx="0" cy="-26" rx="120" ry="16" fill="#c7cede" stroke-width="4"/>${[-120, -60, 0, 60, 120].map((v, k) => `<circle cx="${v}" cy="${-4 + Math.abs(v) * -0.05}" r="11" fill="${['#ffd166', '#7cff9b', '#ff6b6b', '#7cff9b', '#ffd166'][k]}" stroke-width="4"/>`).join('')}<path d="M-50,22 L-70,52 M50,22 L70,52" stroke-width="8" stroke-linecap="round"/></g></g>`;

          // ---------- cocina ----------
          const steam = (x, y) => `<path d="M${x - 20},${y} q-14,-24 0,-48 q14,-24 0,-48 M${x + 20},${y - 10} q-14,-24 0,-48 q14,-24 0,-44" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.6" stroke-linecap="round"/>`;
          const pot = (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s})" stroke="${INK}" stroke-width="5" stroke-linejoin="round">${steam(0, -120)}<path d="M-80,-110 L80,-110 L68,0 L-68,0 Z" fill="#b0603a"/><ellipse cx="0" cy="-110" rx="84" ry="16" fill="#7a3b22"/><path d="M-80,-90 Q-110,-90 -104,-70 M80,-90 Q110,-90 104,-70" fill="none" stroke-width="8"/><path d="M-60,-60 Q0,-40 60,-60" fill="none" stroke="#e8c39a" stroke-width="4"/></g>`;
          const comal = (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s})" stroke="${INK}" stroke-width="5">${steam(0, -50)}<ellipse cx="0" cy="-20" rx="120" ry="24" fill="#3a3a3a"/><ellipse cx="-30" cy="-30" rx="48" ry="12" fill="#f2deb0"/><ellipse cx="34" cy="-26" rx="44" ry="11" fill="#ecd29b"/><path d="M-120,-20 L-150,-26" stroke-width="10"/></g>`;
          const cazuela = (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s})" stroke="${INK}" stroke-width="5">${steam(0, -80)}<path d="M-110,-70 Q0,40 110,-70 Z" fill="#c4683d"/><ellipse cx="0" cy="-70" rx="112" ry="22" fill="#8e2a1c"/>${[-50, -10, 30, 60].map((v, k) => `<circle cx="${v}" cy="${-72 + (k % 2) * 6}" r="13" fill="#a8452c"/>`).join('')}</g>`;
          const meat = (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s})" stroke="${INK}" stroke-width="4"><rect x="-110" y="-20" width="220" height="20" rx="6" fill="#9a6b44"/>${[-70, -20, 30, 75].map((v, k) => `<path d="M${v - 22},-20 Q${v - 26},-52 ${v},-54 Q${v + 26},-52 ${v + 22},-20 Z" fill="#e8a59a"/><path d="M${v - 12},-34 Q${v},-${40 + k} ${v + 12},-34" stroke="#fff3ef" stroke-width="4" fill="none"/>`).join('')}</g>`;
          const chiles = (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s})" stroke="${INK}" stroke-width="4" stroke-linecap="round">${[-40, 0, 40].map((v, k) => `<path d="M${v},-10 C${v - 30},-20 ${v - 20},-70 ${v + 10},-80 C${v + 20},-60 ${v + 18},-30 ${v},-10 Z" fill="${k === 1 ? '#7a1e14' : '#b8261a'}"/><path d="M${v + 10},-80 l6,-14" stroke="#3f8f4f" stroke-width="6"/>`).join('')}</g>`;
          const onion = (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s})" stroke="${INK}" stroke-width="4"><path d="M0,-80 C-46,-60 -46,0 0,0 C46,0 46,-60 0,-80 Z" fill="#f4f1ea"/><path d="M0,-80 C-16,-56 -16,-14 0,0 M0,-80 C16,-56 16,-14 0,0" fill="none" stroke="#c9b9d9" stroke-width="3"/><path d="M0,-80 l0,-16" stroke="#3f8f4f" stroke-width="6"/></g>`;
          const garlic = (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s})" stroke="${INK}" stroke-width="4"><path d="M0,-60 C-38,-46 -38,0 0,0 C38,0 38,-46 0,-60 Z" fill="#fbf6ea"/><path d="M-14,-6 Q-20,-34 0,-58 M14,-6 Q20,-34 0,-58" fill="none" stroke="#d8cfbb" stroke-width="3"/></g>`;
          const tortillas = (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s})" stroke="${INK}" stroke-width="4"><path d="M-80,-10 Q0,30 80,-10 L70,-50 Q0,-20 -70,-50 Z" fill="#d95f2b"/>${[0, 1, 2].map((k) => `<ellipse cx="0" cy="${-56 - k * 8}" rx="70" ry="14" fill="#f2deb0"/>`).join('')}<path d="M-70,-50 Q0,-20 70,-50" fill="none" stroke="#a8452c" stroke-width="5"/></g>`;
          const dish = (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s})" stroke="${INK}" stroke-width="5">${steam(0, -60)}<ellipse cx="0" cy="-20" rx="120" ry="30" fill="#f4f1ea"/><ellipse cx="0" cy="-26" rx="86" ry="18" fill="#8e2a1c"/>${[-40, 0, 36].map((v) => `<circle cx="${v}" cy="-30" r="12" fill="#a8452c"/>`).join('')}<ellipse cx="60" cy="-30" rx="26" ry="8" fill="#f2deb0"/></g>`;
          const table = (W, gy) => `<rect x="${W * 0.38}" y="${gy + 40}" width="${W * 0.6}" height="34" fill="#7a4a24" stroke="${INK}" stroke-width="5"/>`;

          // ---------- personajes (monitos de palito, como Don Chito) ----------
          function person(c, pose, x, y, s, t) {
            const kind = c.kind || 'hombre';
            const cloth = col(c.color, kind === 'mujer' || kind === 'nina' ? COLORS.rosa : COLORS.azul);
            const scared = pose === 'asustado' || pose === 'corre';
            const sw = 9;
            // brazos según la pose
            const arms = {
              parado: 'M0,-120 L-26,-80 L-30,-40 M0,-120 L26,-80 L30,-40',
              camina: 'M0,-120 L-24,-82 L-40,-56 M0,-120 L22,-84 L36,-52',
              asustado: 'M0,-120 L-36,-150 L-44,-190 M0,-120 L36,-150 L44,-190',
              senala: 'M0,-120 L-26,-80 L-30,-40 M0,-120 L40,-128 L86,-140',
              llora: 'M0,-120 L-16,-150 L-10,-176 M0,-120 L16,-150 L10,-176',
              flota: 'M0,-120 L-40,-100 L-70,-110 M0,-120 L40,-100 L70,-110',
              corre: 'M0,-120 L-34,-100 L-56,-120 M0,-120 L30,-90 L52,-70',
              sentado: 'M0,-110 L-26,-80 L-20,-56 M0,-110 L26,-80 L20,-56',
              reza: 'M0,-120 L-20,-100 L0,-130 M0,-120 L20,-100 L0,-130',
            }[pose] || 'M0,-120 L-26,-80 L-30,-40 M0,-120 L26,-80 L30,-40';
            const legs = pose === 'sentado' ? 'M0,-56 L-30,-50 L-34,-6 M0,-56 L30,-50 L34,-6' : pose === 'camina' || pose === 'corre' ? 'M0,-56 L-30,0 M0,-56 L30,0' : 'M0,-56 L-20,0 M0,-56 L20,0';
            const female = ['mujer', 'nina', 'anciana', 'llorona', 'curandera'].includes(kind);
            const small = kind === 'nino' || kind === 'nina' ? 0.75 : 1;
            const headY = -170, R = 36;
            let body = '', head = '', extra = '';
            const eyes = (dx = 13, r = 5, fill = INK) => `<circle cx="${-dx}" cy="${headY}" r="${r}" fill="${fill}"/><circle cx="${dx}" cy="${headY}" r="${r}" fill="${fill}"/>`;
            const mouth = scared ? `<ellipse cx="0" cy="${headY + 18}" rx="7" ry="9" fill="#6b1d14" stroke="${INK}" stroke-width="3"/>` : pose === 'llora' ? `<path d="M-10,${headY + 22} Q0,${headY + 12} 10,${headY + 22}" fill="none" stroke="${INK}" stroke-width="4"/>` : `<path d="M-10,${headY + 14} Q0,${headY + 24} 10,${headY + 14}" fill="none" stroke="${INK}" stroke-width="4"/>`;

            if (kind === 'llorona' || kind === 'fantasma') {
              // Mujer de vestido blanco largo, velo y pelo negro largo; flota, se ve un poco transparente.
              const fl = Math.sin(t / 7) * 6;
              return `<g transform="translate(${x} ${y - 40 + fl}) scale(${s})" opacity="0.92" stroke-linecap="round" stroke-linejoin="round">
          <ellipse cx="0" cy="-90" rx="105" ry="140" fill="#dfe8ff" opacity="0.16"/>
          <path d="M-34,${headY} C-48,${headY + 70} -46,${headY + 130} -30,${headY + 150} L30,${headY + 150} C46,${headY + 130} 48,${headY + 70} 34,${headY} Z" fill="#141018"/>
          <path d="M0,-135 C-40,-110 -60,-40 -70,10 Q-50,0 -35,14 Q-18,0 0,14 Q18,0 35,14 Q50,0 70,10 C60,-40 40,-110 0,-135 Z" fill="#f4f6ff" stroke="${INK}" stroke-width="6"/>
          <path d="${arms}" fill="none" stroke="${INK}" stroke-width="${sw}"/>
          <circle cx="0" cy="${headY}" r="${R}" fill="#f4f6ff" stroke="${INK}" stroke-width="7"/>
          <path d="M-30,${headY - 22} Q0,${headY - 44} 30,${headY - 22} Q12,${headY - 30} 0,${headY - 16} Q-12,${headY - 30} -30,${headY - 22} Z" fill="#141018"/>
          <path d="M-40,${headY - 6} Q0,${headY - 60} 40,${headY - 6} L46,${headY + 66} Q0,${headY + 50} -46,${headY + 66} Z" fill="#ffffff" opacity="0.45" stroke="${INK}" stroke-width="3"/>
          ${kind === 'llorona' ? `<path d="M-12,${headY + 8} L-14,${headY + 24} M12,${headY + 8} L14,${headY + 24}" stroke="#7fb3ff" stroke-width="4"/><path d="M-9,${headY + 22} Q0,${headY + 14} 9,${headY + 22}" stroke="${INK}" stroke-width="4" fill="none"/>` : ''}
          ${eyes(12, 4)}</g>`;
            }
            if (kind === 'extraterrestre') {
              // Marcianito verde de palito: cabeza grande de huevo, ojos negros grandes y antenitas.
              const fl = pose === 'flota' ? Math.sin(t / 7) * 6 - 30 : 0;
              const g = col(c.color === 'verde' || !c.color ? '' : c.color, '#7cd67a');
              return `<g transform="translate(${x} ${y + fl}) scale(${s})" stroke-linecap="round" stroke-linejoin="round">
          <ellipse cx="0" cy="4" rx="40" ry="8" fill="rgba(0,0,0,0.25)"/>
          <path d="${legs}" fill="none" stroke="${INK}" stroke-width="${sw}"/>
          <line x1="0" y1="-134" x2="0" y2="-56" stroke="${INK}" stroke-width="${sw}"/>
          <path d="M-18,-124 L18,-124 L14,-70 L-14,-70 Z" fill="#c7cede" stroke="${INK}" stroke-width="5"/>
          <path d="${arms}" fill="none" stroke="${INK}" stroke-width="${sw}"/>
          <path d="M-14,${headY - 44} L-30,${headY - 84} M14,${headY - 44} L30,${headY - 84}" stroke="${INK}" stroke-width="5"/><circle cx="-30" cy="${headY - 86}" r="8" fill="#ffd166" stroke="${INK}" stroke-width="4"/><circle cx="30" cy="${headY - 86}" r="8" fill="#ffd166" stroke="${INK}" stroke-width="4"/>
          <path d="M0,${headY - 52} C40,${headY - 52} 50,${headY - 10} 34,${headY + 18} C22,${headY + 40} -22,${headY + 40} -34,${headY + 18} C-50,${headY - 10} -40,${headY - 52} 0,${headY - 52} Z" fill="${g}" stroke="${INK}" stroke-width="7"/>
          <path d="M-30,${headY - 8} Q-22,${headY - 22} -6,${headY - 10} Q-10,${headY + 10} -24,${headY + 8} Z" fill="${INK}"/><path d="M30,${headY - 8} Q22,${headY - 22} 6,${headY - 10} Q10,${headY + 10} 24,${headY + 8} Z" fill="${INK}"/><circle cx="-18" cy="${headY - 10}" r="3" fill="#fff"/><circle cx="18" cy="${headY - 10}" r="3" fill="#fff"/>
          ${scared ? `<ellipse cx="0" cy="${headY + 26}" rx="5" ry="6" fill="${INK}"/>` : `<path d="M-6,${headY + 24} Q0,${headY + 28} 6,${headY + 24}" fill="none" stroke="${INK}" stroke-width="3"/>`}
          </g>`;
            }
            if (kind === 'sombra') {
              return `<g transform="translate(${x} ${y}) scale(${s})" stroke-linecap="round"><path d="M0,-56 L-20,0 M0,-56 L20,0 M0,-140 L0,-56 ${arms}" stroke="#0b0812" stroke-width="16" fill="none"/><circle cx="0" cy="${headY}" r="${R + 4}" fill="#0b0812"/><circle cx="-13" cy="${headY}" r="6" fill="#ff3b30"/><circle cx="13" cy="${headY}" r="6" fill="#ff3b30"/></g>`;
            }
            if (kind === 'nahual') return dog(x, y, s * 1.6, '#151018', '#ff3b30');
            if (kind === 'jinete_sin_cabeza') {
              return `<g>${horse(x, y, s * 1.2, '#2a2230', '#ff3b30')}<g transform="translate(${x} ${y - 125 * s}) scale(${s})" stroke="${INK}" stroke-linecap="round"><path d="M0,-40 L0,40 M0,-30 L-30,10 M0,-30 L34,0" stroke-width="${sw}" fill="none"/><path d="M-26,-50 L26,-50 L18,-30 L-18,-30 Z" fill="#3a2f45" stroke-width="5"/></g></g>`;
            }
            const charro = kind === 'charro_negro';
            if (female) body = `<path d="M0,-130 L-38,-30 L38,-30 Z" fill="${kind === 'llorona' ? '#f4f6ff' : cloth}" stroke="${INK}" stroke-width="6"/>`;
            else body = `<path d="M-20,-122 L20,-122 L16,-70 L-16,-70 Z" fill="${charro ? '#151018' : cloth}" stroke="${INK}" stroke-width="5"/>`;
            head = `<circle cx="0" cy="${headY}" r="${R}" fill="white" stroke="${INK}" stroke-width="7"/>` + (charro ? eyes(13, 6, '#ff3b30') : eyes()) + mouth;
            if (kind === 'anciano' || kind === 'anciana') head += `<path d="M-24,${headY - 18} L-8,${headY - 14} M8,${headY - 14} L24,${headY - 18}" stroke="${INK}" stroke-width="4"/>`;
            if (!female && kind !== 'nino') head += `<path d="M0,${headY + 10} C-8,${headY + 2} -24,${headY + 4} -28,${headY + 14} C-24,${headY + 20} -12,${headY + 14} 0,${headY + 16} C12,${headY + 14} 24,${headY + 20} 28,${headY + 14} C24,${headY + 4} 8,${headY + 2} 0,${headY + 10} Z" fill="${kind === 'anciano' ? '#cfcfcf' : INK}"/>`;
            const hat = c.hat || (charro ? 'sombrero' : female ? (kind === 'anciana' || kind === 'curandera' ? 'rebozo' : 'trenzas') : kind === 'nino' ? 'ninguno' : 'sombrero');
            if (hat === 'sombrero') {
              const hc = charro ? '#151018' : '#e9c46a';
              extra = `<path d="M-30,${headY - 30} C-32,${headY - 70} -16,${headY - 84} 0,${headY - 84} C16,${headY - 84} 32,${headY - 70} 30,${headY - 30} Z" fill="${hc}" stroke="${INK}" stroke-width="6"/><ellipse cx="0" cy="${headY - 28}" rx="${charro ? 90 : 78}" ry="13" fill="${hc}" stroke="${INK}" stroke-width="6"/>${charro ? `<path d="M-60,${headY - 26} Q0,${headY - 16} 60,${headY - 26}" stroke="#c9a227" stroke-width="4" fill="none"/>` : ''}`;
            } else if (hat === 'gorra') extra = `<path d="M-34,${headY - 12} Q0,${headY - 60} 34,${headY - 12} Z" fill="${cloth}" stroke="${INK}" stroke-width="5"/><path d="M20,${headY - 14} L58,${headY - 10}" stroke="${INK}" stroke-width="7"/>`;
            else if (hat === 'rebozo') extra = `<path d="M-40,${headY + 6} Q-46,${headY - 50} 0,${headY - 48} Q46,${headY - 50} 40,${headY + 6} L46,${headY + 70} L30,${headY + 20} Q0,${headY - 30} -30,${headY + 20} L-46,${headY + 70} Z" fill="${col(c.color, '#5d4a7a')}" stroke="${INK}" stroke-width="5"/>`;
            else if (hat === 'trenzas') extra = `<path d="M-34,${headY - 10} Q0,${headY - 56} 34,${headY - 10}" fill="${INK}"/><path d="M-34,${headY} Q-46,${headY + 40} -36,${headY + 70} M34,${headY} Q46,${headY + 40} 36,${headY + 70}" stroke="${INK}" stroke-width="10" fill="none"/>`;
            const sit = pose === 'sentado' ? 50 : 0;
            return `<g transform="translate(${x} ${y + sit * s}) scale(${s * small})" stroke-linecap="round" stroke-linejoin="round">
          <ellipse cx="0" cy="4" rx="44" ry="8" fill="rgba(0,0,0,0.25)"/>
          <path d="${legs}" fill="none" stroke="${INK}" stroke-width="${sw}"/>
          <line x1="0" y1="-134" x2="0" y2="-56" stroke="${INK}" stroke-width="${sw}"/>
          ${body}<path d="${arms}" fill="none" stroke="${INK}" stroke-width="${sw}"/>
          ${hat === 'rebozo' ? extra + head : head + extra}
          ${charro ? '' : `<path d="M-14,-136 L14,-136 L0,-118 Z" fill="${col(c.color, COLORS.rojo)}" stroke="${INK}" stroke-width="3"/>`}
          </g>`;
          }

          /** Dibuja el fondo completo de una escena. t = número de escena (varía un poco la composición). */
          function sceneSVG(set = {}, cast = [], {w = 1920, h = 1080, t = 0, horror = false} = {}) {
            const lugar = BG_LUGARES.includes(set.lugar) ? set.lugar : 'rancho';
            const hora = BG_HORAS.includes(set.hora) ? set.hora : horror ? 'noche' : 'dia';
            const cosas = new Set((Array.isArray(set.cosas) ? set.cosas : []).filter((c) => BG_COSAS.includes(c)));
            if (hora === 'noche') {
              cosas.add('luna');
              cosas.add('estrellas');
            }
            const r = rng(hash(lugar + hora + t));
            const vertical = h > w;
            // Todo se dibuja en un lienzo de 1920x1080 y se ajusta; en vertical se dibuja más alto.
            const W = vertical ? 1080 : 1920, H = vertical ? 1920 : 1080;
            const gy = vertical ? 1380 : 820; // línea del suelo
            const [s1, s2, s3] = SKY[hora];
            const [g1, g2] = GROUND[hora];
            const night = hora === 'noche';
            const glow = night || hora === 'atardecer';
            let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s1}"/><stop offset="0.6" stop-color="${s2}"/><stop offset="1" stop-color="${s3}"/></linearGradient></defs>`;
            svg += `<rect width="${W}" height="${H}" fill="url(#sky)"/>`;
            if (cosas.has('estrellas')) for (let i = 0; i < 60; i++) svg += `<circle cx="${(r() * W) | 0}" cy="${(r() * gy * 0.6) | 0}" r="${(1.5 + r() * 2.5).toFixed(1)}" fill="#fff" opacity="${(0.4 + r() * 0.5).toFixed(2)}"/>`;
            const mx = cosas.has('ovni') ? W * (vertical ? 0.2 : 0.3) : W * (0.62 + r() * 0.25), my = gy * 0.2;
            if (cosas.has('luna')) svg += `<circle cx="${mx}" cy="${my}" r="${W * 0.1}" fill="#fff4d6" opacity="0.12"/><circle cx="${mx}" cy="${my}" r="${W * 0.055}" fill="#fff4d6" stroke="${INK}" stroke-width="5"/><circle cx="${mx - 20}" cy="${my - 10}" r="12" fill="#efe1b8"/><circle cx="${mx + 25}" cy="${my + 20}" r="8" fill="#efe1b8"/>`;
            else if (hora === 'dia') svg += `<circle cx="${mx}" cy="${my}" r="${W * 0.05}" fill="#ffd166" stroke="${INK}" stroke-width="5"/>`;
            else svg += `<circle cx="${mx}" cy="${gy - 40}" r="${W * 0.06}" fill="#ffb347" stroke="${INK}" stroke-width="5" opacity="0.9"/>`;
            // cerros
            svg += `<path d="M0,${gy - 120} Q${W * 0.2},${gy - 260} ${W * 0.42},${gy - 140} T${W * 0.85},${gy - 170} T${W},${gy - 120} L${W},${gy} L0,${gy} Z" fill="${night ? '#3a2b5c' : hora === 'dia' ? '#b8a07a' : '#6e4a6a'}" stroke="${INK}" stroke-width="4"/>`;
            svg += `<path d="M0,${gy - 40} Q${W * 0.3},${gy - 110} ${W * 0.6},${gy - 50} T${W},${gy - 60} L${W},${gy} L0,${gy} Z" fill="${night ? '#30244d' : hora === 'dia' ? '#c9ae7f' : '#5e3f5e'}" stroke="${INK}" stroke-width="4"/>`;
            // suelo
            svg += `<rect x="0" y="${gy}" width="${W}" height="${H - gy}" fill="${g1}"/><path d="M0,${gy + (H - gy) * 0.45} Q${W / 2},${gy + (H - gy) * 0.3} ${W},${gy + (H - gy) * 0.5} L${W},${H} L0,${H} Z" fill="${g2}"/><line x1="0" y1="${gy}" x2="${W}" y2="${gy}" stroke="${INK}" stroke-width="5"/>`;

            // Lugar (lo importante va del centro a la derecha; el tercio izquierdo queda para Don Chito)
            const R = (a, b) => a + r() * (b - a);
            const cx = vertical ? W * 0.5 : W * 0.62;
            const sc = vertical ? 0.95 : 1;
            const plant = night ? '#2c4a3a' : '#5f9a4a';
            switch (lugar) {
              case 'arroyo':
              case 'rio': {
                const water = lugar === 'rio' || cosas.has('lluvia');
                svg += `<path d="M${W * 0.3},${H} C${W * 0.45},${gy + 140} ${W * 0.55},${gy + 60} ${W},${gy + 30} L${W},${gy + 110} C${W * 0.7},${gy + 150} ${W * 0.6},${gy + 240} ${W * 0.55},${H} Z" fill="${water ? (night ? '#3d6aa8' : '#6fb3e0') : night ? '#4a3c5c' : '#e3c992'}" stroke="${INK}" stroke-width="5"/>`;
                if (!water) for (let i = 0; i < 8; i++) svg += `<path d="M${R(W * 0.45, W * 0.95)},${R(gy + 50, gy + 200)} l${R(-30, 30)},${R(10, 30)}" stroke="${INK}" stroke-width="3" opacity="0.6"/>`;
                svg += tree(W * 0.86, gy + 30, 1.3 * sc, '#5b3a22', plant) + rock(W * 0.7, gy + 120, 1.2) + nopal(W * 0.95, gy + 60, 0.9, plant);
                break;
              }
              case 'fogata':
                svg += campfire(cx, gy + 150, 1.7 * sc) + rock(cx - 160, gy + 150, 0.9) + nopal(W * 0.93, gy + 40, 1, plant) + adobe(W * 0.8, gy + 10, 0.9 * sc, '#c98f5e', glow);
                break;
              case 'panteon':
                for (let i = 0; i < 6; i++) svg += i % 2 ? cross(R(W * 0.42, W * 0.97), gy + R(30, 160), R(0.9, 1.4), '#8d8a9c') : tomb(R(W * 0.42, W * 0.97), gy + R(30, 160), R(0.9, 1.3));
                svg += tree(W * 0.9, gy + 20, 1.5 * sc, '#3c2a3a', null) + candle(W * 0.62, gy + 170, 1.1);
                break;
              case 'milpa':
                for (let i = 0; i < 14; i++) svg += corn(W * (0.4 + i * 0.045), gy + 40 + (i % 3) * 30, 1.1 * sc);
                break;
              case 'camino':
                svg += `<path d="M${W * 0.42},${H} L${W * 0.62},${gy} L${W * 0.68},${gy} L${W * 0.95},${H} Z" fill="${night ? '#5a4a6a' : '#e0c690'}" stroke="${INK}" stroke-width="5"/>` + tree(W * 0.9, gy + 20, 1.2, '#5b3a22', plant) + nopal(W * 0.45, gy + 30, 0.9, plant);
                break;
              case 'cerro':
              case 'monte':
                svg += tree(W * 0.55, gy + 30, 1.4, '#5b3a22', plant) + tree(W * 0.75, gy + 10, 1.1, '#5b3a22', plant) + tree(W * 0.92, gy + 40, 1.5, '#5b3a22', plant) + rock(W * 0.66, gy + 140, 1.4) + nopal(W * 0.45, gy + 80, 1.1, plant);
                break;
              case 'pozo':
                svg += well(cx + 60, gy + 120, 1.3 * sc) + tree(W * 0.9, gy + 20, 1.3, '#5b3a22', plant) + rock(cx - 120, gy + 140, 0.8);
                break;
              case 'hacienda':
                svg += hacienda(W * (vertical ? 0.25 : 0.5), gy + 30, 1.2 * sc, glow) + nopal(W * 0.95, gy + 70, 1, plant);
                break;
              case 'capilla':
                svg += chapel(cx + 80, gy + 30, 1.1 * sc, glow) + cross(W * 0.93, gy + 120, 1.2, '#8d8a9c') + candle(cx - 80, gy + 160, 1.2);
                break;
              case 'cocina': {
                svg = svg.replace(/<rect width="\d+" height="\d+" fill="url\(#sky\)"\/>/, '');
                svg += `<rect width="${W}" height="${H}" fill="${glow ? '#5a3a33' : '#d9b48a'}"/><rect x="0" y="${gy}" width="${W}" height="${H - gy}" fill="${glow ? '#3a2622' : '#a0764f'}"/><line x1="0" y1="${gy}" x2="${W}" y2="${gy}" stroke="${INK}" stroke-width="5"/>`;
                svg += `<rect x="${W * 0.72}" y="${gy - 360}" width="220" height="160" fill="${night ? '#1d1840' : '#9fd6f2'}" stroke="${INK}" stroke-width="8"/><path d="M${W * 0.72 + 110},${gy - 360} L${W * 0.72 + 110},${gy - 200}" stroke="${INK}" stroke-width="6"/>`;
                const cooking = ['olla', 'comal', 'cazuela', 'carne', 'chiles', 'cebolla', 'ajo', 'tortillas', 'plato'].some((c) => cosas.has(c));
                // Colgadero con cazuelitas y ristra de chiles en la pared (cocina de rancho).
                svg += `<path d="M${W * 0.4},${gy - 470} L${W * 0.62},${gy - 470}" stroke="#7a4a24" stroke-width="10"/>` + [0.43, 0.49, 0.55, 0.6].map((f, k) => `<path d="M${W * f},${gy - 466} l0,26" stroke="${INK}" stroke-width="3"/><path d="M${W * f - 26},${gy - 440} Q${W * f},${gy - 400} ${W * f + 26},${gy - 440} Z" fill="${k % 2 ? '#c4683d' : '#b0603a'}" stroke="${INK}" stroke-width="4"/>`).join('');
                if (!cooking) {
                  svg += `<rect x="${W * 0.45}" y="${gy - 30}" width="320" height="30" fill="#7a4a24" stroke="${INK}" stroke-width="5"/><path d="M${W * 0.47},${gy} L${W * 0.47},${gy + 120} M${W * 0.45 + 300},${gy} L${W * 0.45 + 300},${gy + 120}" stroke="${INK}" stroke-width="10"/>`;
                  svg += `<path d="M${W * 0.86},${gy + 130} L${W * 0.86},${gy - 90} L${W * 0.98},${gy - 90} L${W * 0.98},${gy + 130} Z" fill="#9a8f84" stroke="${INK}" stroke-width="5"/>`;
                }
                if (night) svg += candle(W * 0.55, gy - 30, 1.2);
                break;
              }
              case 'nave': {
                // Por dentro de la nave: paredes metálicas, ventana redonda con estrellas, tablero de lucecitas.
                svg = svg.replace(/<rect width="\d+" height="\d+" fill="url\(#sky\)"\/>/, '');
                svg += `<rect width="${W}" height="${H}" fill="#3b3f5c"/><path d="M0,0 Q${W / 2},${H * 0.18} ${W},0 Z" fill="#2a2d45"/><rect x="0" y="${gy}" width="${W}" height="${H - gy}" fill="#5c6280"/><line x1="0" y1="${gy}" x2="${W}" y2="${gy}" stroke="${INK}" stroke-width="5"/>`;
                for (let i = 1; i < 6; i++) svg += `<line x1="${(W / 6) * i}" y1="0" x2="${(W / 6) * i}" y2="${gy}" stroke="#2a2d45" stroke-width="6"/>`;
                const wx = W * (vertical ? 0.5 : 0.72), wy = gy - (vertical ? 620 : 430), wr = vertical ? 200 : 170;
                svg += `<circle cx="${wx}" cy="${wy}" r="${wr + 24}" fill="#9aa3b5" stroke="${INK}" stroke-width="7"/><circle cx="${wx}" cy="${wy}" r="${wr}" fill="#0d0a24" stroke="${INK}" stroke-width="6"/>`;
                for (let i = 0; i < 26; i++) { const a = r() * 6.283, d = r() * wr * 0.9; svg += `<circle cx="${(wx + Math.cos(a) * d) | 0}" cy="${(wy + Math.sin(a) * d) | 0}" r="${(1.5 + r() * 3).toFixed(1)}" fill="#fff"/>`; }
                svg += `<circle cx="${wx - wr * 0.35}" cy="${wy + wr * 0.3}" r="${wr * 0.28}" fill="#3f8f4f" stroke="${INK}" stroke-width="4"/><path d="M${wx - wr * 0.5},${wy + wr * 0.25} q${wr * 0.12},-${wr * 0.12} ${wr * 0.26},0" fill="none" stroke="#2f6db5" stroke-width="8"/>`;
                const px = W * (vertical ? 0.1 : 0.42), pw = W * (vertical ? 0.8 : 0.5);
                svg += `<path d="M${px},${gy + 40} L${px + 40},${gy - 120} L${px + pw - 40},${gy - 120} L${px + pw},${gy + 40} Z" fill="#9aa3b5" stroke="${INK}" stroke-width="6"/>`;
                for (let i = 0; i < 10; i++) svg += `<circle cx="${px + 70 + i * ((pw - 140) / 9)}" cy="${gy - 70 + (i % 2) * 40}" r="13" fill="${['#ff6b6b', '#7cff9b', '#ffd166', '#7cc8ff'][i % 4]}" stroke="${INK}" stroke-width="4"/>`;
                svg += `<rect width="${W}" height="${H}" fill="#7cff9b" opacity="0.06"/>`;
                break;
              }
              case 'corral':
                svg += fence(W * 0.38, W, gy + 90, '#9a6b44') + adobe(W * 0.78, gy, 0.6, '#c98f5e', glow);
                if (!cosas.has('caballo') && !cosas.has('vaca')) cosas.add('vaca');
                break;
              case 'pueblo':
                svg += adobe(W * 0.42, gy + 10, 0.8 * sc, '#c98f5e', glow) + adobe(W * 0.66, gy + 20, 0.9 * sc, '#d9a87a', glow) + chapel(W * 0.93, gy + 10, 0.8, glow);
                break;
              default: // rancho
                svg += adobe(cx - 40, gy + 30, 1.1 * sc, '#c98f5e', glow) + fence(W * 0.82, W, gy + 100, '#9a6b44') + nopal(W * 0.42, gy + 70, 1, plant);
            }
            // Cosas
            const spot = () => [R(W * (vertical ? 0.15 : 0.42), W * 0.95), gy + R(80, 200)];
            if (cosas.has('fogata') && lugar !== 'fogata') svg += campfire(...spot(), 1);
            if (cosas.has('arbol')) svg += tree(...spot(), 1.2, '#5b3a22', plant);
            if (cosas.has('nopal')) svg += nopal(...spot(), 1, plant);
            if (cosas.has('cruz') && lugar !== 'panteon') svg += cross(...spot(), 1.1, '#8d8a9c');
            if (cosas.has('piedra')) svg += rock(...spot(), 1.2);
            if (cosas.has('carreta')) svg += cart(...spot(), 1);
            if (cosas.has('veladora') && lugar !== 'capilla') svg += candle(...spot(), 1.2);
            if (cosas.has('vaca')) svg += cow(...spot(), 1);
            if (cosas.has('caballo')) svg += horse(...spot(), 1, '#8a5a2b');
            if (cosas.has('perro')) svg += dog(...spot(), 1, '#c9a77a');
            if (cosas.has('gallina')) svg += hen(...spot(), 1.1);
            if (cosas.has('ovni') && lugar !== 'nave') svg += ufo(W * (vertical ? 0.62 : 0.66), gy * (vertical ? 0.3 : 0.26), vertical ? 1.3 : 1.5, gy + (vertical ? 120 : 160));
            if (cosas.has('lechuza')) svg += owl(W * 0.88, gy - 220, 1.4);
            const cook = ['olla', 'comal', 'cazuela', 'carne', 'chiles', 'cebolla', 'ajo', 'tortillas', 'plato'].filter((c) => cosas.has(c));
            if (cook.length) {
              // Mesa grande de madera con los ingredientes (en vertical, más arriba porque Don Chito va abajo al centro).
              const ty = vertical ? gy - 680 : gy + 150; // en vertical: repisa arriba, para no tapar a Don Chito
              svg += `<rect x="${vertical ? W * 0.04 : W * 0.4}" y="${ty}" width="${vertical ? W * 0.92 : W * 0.58}" height="40" fill="#7a4a24" stroke="${INK}" stroke-width="6"/>`;
              const n = cook.length;
              const xs = cook.map((_, k) => (vertical ? W * (n === 1 ? 0.5 : 0.16 + (k / (n - 1)) * 0.68) : W * (n === 1 ? 0.68 : 0.48 + (k / (n - 1)) * 0.42)));
              const big = (vertical ? 1.15 : 2.1) * (n > 3 ? 0.72 : n > 2 ? 0.85 : 1);
              cook.forEach((c, k) => {
                const x = xs[k], y = ty;
                svg += {olla: pot, comal, cazuela, carne: meat, chiles, cebolla: onion, ajo: garlic, tortillas, plato: dish}[c](x, y, big);
              });
            }
            if (cosas.has('huellas')) for (let i = 0; i < 6; i++) svg += `<ellipse cx="${W * 0.5 + i * 60}" cy="${gy + 200 - i * 18}" rx="12" ry="7" fill="${INK}" opacity="0.5"/>`;

            // Personajes de la escena (aspecto fijo del cast), del centro a la derecha
            const people = (Array.isArray(set.personajes) ? set.personajes : []).slice(0, 4);
            const byName = new Map((cast || []).map((c) => [String(c.name || '').toLowerCase(), c]));
            people.forEach((p, i) => {
              const c = byName.get(String(p.name || '').toLowerCase()) || {kind: 'hombre'};
              const n = people.length;
              // En vertical Don Chito va abajo al centro: los personajes van a los lados.
              const x = vertical ? W * (n === 1 ? 0.84 : [0.16, 0.84, 0.16, 0.84][i]) : W * (0.5 + (n === 1 ? 0.22 : (i / Math.max(1, n - 1)) * 0.36));
              svg += person(c, BG_POSES.includes(p.pose) ? p.pose : 'parado', x, gy + (vertical ? 60 : 110) + (i % 2) * 24, (vertical ? 1.05 : 1.6) * (n > 2 ? 0.85 : 1), t);
            });
            if (cosas.has('linterna')) svg += lantern(...spot(), 1.3);
            if (cosas.has('lluvia')) for (let i = 0; i < 120; i++) { const x = r() * W, y = r() * H; svg += `<path d="M${x},${y} l-8,26" stroke="#a9c6ff" stroke-width="3" opacity="0.6"/>`; }
            if (cosas.has('niebla') || (horror && night)) svg += `<path d="M0,${gy + 40} Q${W * 0.25},${gy - 10} ${W * 0.5},${gy + 50} T${W},${gy + 30} L${W},${gy + 140} L0,${gy + 140} Z" fill="#e6e0f5" opacity="0.18"/>`;
            if (night) svg += `<rect width="${W}" height="${H}" fill="#120c2a" opacity="0.12"/>`;
            return svg + '</svg>';
          }

          const isHorrorTopic = (t) => /terror|leyenda|espanto|aparec|llorona|nahual|fantasma|bruja|charro negro|diablo|duende|[áa]nima|pante[óo]n|miedo|maldi|lechuza|chupacabras|sombra|embrujad|ovni|extraterrestre|marciano|abduc|alien/i.test(String(t || ''));

          /** Dibuja el fondo de una escena con código, lo pasa a PNG con ffmpeg y devuelve la ruta. */
          function codeBackground(p, i, vertical) {
            const dir = join(WORK, p.id + '-bg');
            mkdirSync(dir, {recursive: true});
            const svg = sceneSVG(p.scenes[i].set || {}, p.cast || [], {w: vertical ? 1080 : 1920, h: vertical ? 1920 : 1080, t: i, horror: isHorrorTopic(p.topic)});
            const src = join(dir, `bg-${i}${vertical ? '-v' : ''}.svg`), out = src.replace(/\.svg$/, '.png');
            writeFileSync(src, svg);
            ff(['-i', src, '-frames:v', '1', out]);
            return out;
          }

          /** Sube el fondo dibujado con código como imagen de la escena (así sirve igual para Shorts, portada y aprobación). */
          async function uploadCodeBackground(p, i) {
            const file = codeBackground(p, i, p.format === 'Short');
            const r = await request('image-upload', {
              method: 'POST',
              headers: {'Content-Type': 'image/png', 'X-Project-Id': p.id, 'X-Scene-Index': String(i), 'X-Image-Origin': 'illustration'},
              body: readFileSync(file),
            });
            const j = await r.json().catch(() => ({}));
            if (!r.ok) throw Error(j.error || 'La app no aceptó el fondo dibujado');
            return j;
          }

          // ---------- Don Chito: guion e imágenes gratis (app), voz edge-tts, edición con Remotion ----------
          async function produceDonChito(p) {
            const id = p.id;
            const steps = () => p.scenes.length * 2 + 3;
            let done = 0;
            const step = (stage, message, scene) =>
              api('production-state', {id, progress: {stage, message: 'Don Chito · ' + message, scene, total: p.scenes.length, done, steps: steps(), status: 'running'}}).catch(() => {});

            if (!p.autopilot?.scriptDone) {
              await step('script', 'escribiendo el guion (IA gratis)');
              p = await api('ai-script', {id, brief: p.brief || ''});
              p = await api('robot/report', {id, scriptDone: true});
              log('Guion listo: ' + p.title + ' (' + p.scenes.length + ' escenas)');
            }
            // Fondos: 'codigo' = siempre dibujados con código; 'auto' = IA de Cloudflare y, si se acaba la cuota, con código.
            const bgMode = p.bgMode || 'auto';
            let codeBg = bgMode === 'codigo';
            if (codeBg) log('Fondos dibujados con código');
            for (let i = 0; i < p.scenes.length; i++) {
              if (!p.scenes[i].image && codeBg) {
                await step('image', `dibujando escena ${i + 1} de ${p.scenes.length} (código)`, i + 1);
                p = await uploadCodeBackground(p, i);
              }
              if (!p.scenes[i].image) {
                await step('image', `dibujando escena ${i + 1} de ${p.scenes.length}`, i + 1);
                // Solo el fondo: a Don Chito lo dibuja Remotion con código encima.
                const bg = String(p.scenes[i].visualPrompt || p.scenes[i].text).replace(/don chito('s)?/gi, 'the scene');
                // Don Chito lo dibuja Remotion: aquí solo el lugar y los personajes de la historia (con su aspecto fijo del cast).
                try {
                  p = await api('ai-image', {id, index: i, prompt: bg + '. Without Don Chito (no stick figure ranchero, he is added later). Keep the left third of the picture simple and mostly empty.', force: false});
                } catch (e) {
                  if (bgMode !== 'auto' || !/4006|cuota/i.test(e.message)) throw e;
                  codeBg = true;
                  log('Se acabó la cuota de dibujos de IA: el resto de los fondos se dibujan con código.');
                  p = await uploadCodeBackground(p, i);
                }
              }
              done++;
              const a = p.scenes[i].audio;
              if (!a || a.text !== p.scenes[i].text || !String(a.voice || '').startsWith('Edge · ')) {
                await step('voice', `voz ${i + 1} de ${p.scenes.length}`, i + 1);
                // Siempre la misma voz y el mismo tono: Jorge (México), un poco pausado para que se entienda cada palabra.
                p = await edgeVoice(p, i, {rate: '-5%', pitch: '-2Hz'});
              }
              done++;
              if (i % 5 === 4 || i === p.scenes.length - 1) log(`Escenas ${i + 1}/${p.scenes.length} listas`);
            }
            if (!p.thumbnailImage) {
              await step('thumbnail', 'creando la portada');
              p = await api('ai-thumbnail', {id, title: p.coverTitle || p.title, prompt: p.coverPrompt || ''}).catch((e) => (log('Portada: ' + e.message), p));
            }
            done++;
            await step('render', 'editando con Remotion');
            const job = await api('render', {id});
            const {file, durations} = await renderRemotion(job);
            log('Video armado: ' + (statSync(file).size / 1e6).toFixed(1) + ' MB');
            const r = await request('video', {
              method: 'POST',
              headers: {'Content-Type': 'video/mp4', 'X-Project-Id': id, 'X-Render-Token': job.renderToken, 'X-Scene-Durations': JSON.stringify(durations)},
              body: readFileSync(file),
            });
            const result = await r.json().catch(() => ({}));
            if (!r.ok) throw Error(result.error || 'La app no aceptó el video');
            await api('production-state', {id, progress: {stage: 'complete', message: 'Don Chito · listo para tu aprobación', total: p.scenes.length, done: steps(), steps: steps(), status: 'complete'}}).catch(() => {});

            // Del video largo salen 3 Shorts (mismas imágenes y voz, sin gastar IA).
            if (p.format !== 'Short') {
              const {created = []} = await api('robot/shorts', {id}).catch((e) => (log('Shorts: ' + e.message), {}));
              for (const c of created) {
                try {
                  log('Short: ' + c.title);
                  await produceDonChito(c);
                } catch (e) {
                  log('Short con error: ' + e.message);
                  await api('robot/report', {id: c.id, error: e.message}).catch(() => {});
                }
              }
            }
            return result;
          }

          /** Pose de Don Chito según la escena (misma lógica que remotion/Chito.tsx). */
          function poseFor(text, visual, i, total) {
            const v = (visual + ' ' + text).toLowerCase();
            if (i === total - 1) return 'feliz';
            if (/point|señal|mira|look at|this is/.test(v)) return 'senala';
            if (/think|wonder|piens|imagin|¿/.test(v) && i % 2 === 0) return 'piensa';
            if (/surpris|shock|scared|asust|sorpren|increíble|!/.test(v)) return 'sorprendido';
            if (/sad|worr|cry|trist|sequía|drought|sick|enferm|muri/.test(v)) return 'triste';
            if (/walk|camin|travel|road|camino|ride|horse|caballo/.test(v)) return 'camina';
            if (/work|milk|dig|hammer|cook|carry|plant|harvest|ordeñ|trabaj|cocin|siembr|cosech|cargar|build/.test(v)) return 'trabaja';
            if (/happy|laugh|party|fiesta|feliz|celebr|boda|wedding/.test(v)) return 'feliz';
            return i % 3 === 1 ? 'senala' : 'habla';
          }

          const KIT = {
          "package.json": "{\n  \"name\": \"donchito-remotion\",\n  \"private\": true,\n  \"dependencies\": {\n    \"@remotion/cli\": \"4.0.528\",\n    \"remotion\": \"4.0.528\",\n    \"react\": \"19.2.0\",\n    \"react-dom\": \"19.2.0\"\n  }\n}\n",
          "src/index.ts": "import {registerRoot} from 'remotion';\nimport {RemotionRoot} from './Root';\nregisterRoot(RemotionRoot);\n",
          "src/Root.tsx": "import React from 'react';\nimport {Composition, CalculateMetadataFunction} from 'remotion';\nimport {DonChito, Props} from './DonChito';\n\nconst calc: CalculateMetadataFunction<Props> = ({props}) => ({\n  durationInFrames: Math.max(30, props.scenes.reduce((a, s) => a + s.frames, 0)),\n  width: props.format === 'Short' ? 1080 : 1920,\n  height: props.format === 'Short' ? 1920 : 1080,\n});\n\nexport const RemotionRoot: React.FC = () => (\n  <Composition\n    id=\"DonChito\"\n    component={DonChito}\n    durationInFrames={300}\n    fps={30}\n    width={1920}\n    height={1080}\n    defaultProps={{format: 'Video largo', hook: '', badge: 'DON CHITO', outro: '', scenes: []} as Props}\n    calculateMetadata={calc}\n  />\n);\n",
          "src/DonChito.tsx": "import React, {useMemo} from 'react';\nimport {AbsoluteFill, Img, Sequence, staticFile, useCurrentFrame, useVideoConfig, interpolate, Easing} from 'remotion';\nimport {Chito, Pose} from './Chito';\n\nexport type Word = {t: number; w: string};\nexport type SceneP = {img: string; frames: number; text: string; words?: Word[] | null; pose?: Pose};\nexport type Props = {format: string; hook: string; badge: string; outro: string; scenes: SceneP[]};\n\nconst FONT = 'Montserrat, \"DejaVu Sans\", Arial, sans-serif';\nconst PAPER = '#f3e7cf';\nconst INK = '#2a1b10';\nconst YELLOW = '#ffd23f';\nconst RED = '#b23a26';\nconst clamp = {extrapolateLeft: 'clamp', extrapolateRight: 'clamp'} as const;\n\ntype Group = {start: number; end: number; words: Word[]};\n\nfunction groupsFor(s: SceneP, fps: number, vertical: boolean): Group[] {\n  const total = s.frames / fps;\n  let words: Word[] = (s.words || []).filter((x) => x && x.w);\n  if (!words.length) {\n    // Sin tiempos de palabra: se reparten según el largo de cada palabra.\n    const list = s.text.split(/\\s+/).filter(Boolean);\n    const chars = list.reduce((a, w) => a + w.length + 1, 0) || 1;\n    let acc = 0;\n    words = list.map((w) => {\n      const t = (acc / chars) * Math.max(0.5, total - 0.35);\n      acc += w.length + 1;\n      return {t, w};\n    });\n  }\n  const per = vertical ? 3 : 5;\n  const chunks: Word[][] = [];\n  for (let i = 0; i < words.length; i += per) chunks.push(words.slice(i, i + per));\n  if (chunks.length > 1 && chunks[chunks.length - 1].length === 1) chunks[chunks.length - 2].push(...chunks.pop()!);\n  return chunks.map((c, k) => ({start: c[0].t, end: k + 1 < chunks.length ? chunks[k + 1][0].t : total, words: c}));\n}\n\nconst Captions: React.FC<{s: SceneP; vertical: boolean}> = ({s, vertical}) => {\n  const frame = useCurrentFrame();\n  const {fps} = useVideoConfig();\n  const groups = useMemo(() => groupsFor(s, fps, vertical), [s, fps, vertical]);\n  const t = frame / fps;\n  const g = groups.find((x) => t >= x.start && t < x.end);\n  if (!g) return null;\n  const local = (t - g.start) * fps;\n  let current = 0;\n  g.words.forEach((w, i) => {\n    if (w.t <= t) current = i;\n  });\n  return (\n    <AbsoluteFill style={{justifyContent: 'flex-end', alignItems: 'center', paddingBottom: vertical ? 1010 : 70}}>\n      <div\n        style={{\n          maxWidth: vertical ? 940 : 1640,\n          textAlign: 'center',\n          fontFamily: FONT,\n          fontWeight: 900,\n          fontSize: vertical ? 82 : 62,\n          lineHeight: 1.12,\n          color: 'white',\n          textTransform: 'uppercase',\n          WebkitTextStroke: (vertical ? 14 : 9) + 'px ' + INK,\n          paintOrder: 'stroke fill',\n          textShadow: '0 6px 0 rgba(0,0,0,0.35)',\n          scale: String(interpolate(local, [0, 4], [0.86, 1], {...clamp, easing: Easing.out(Easing.back(2))})),\n        }}\n      >\n        {g.words.map((w, i) => (\n          <span key={i} style={{color: i === current ? YELLOW : 'white', display: 'inline-block', margin: '0 0.24em', scale: i === current ? '1.08' : '1'}}>\n            {w.w}\n          </span>\n        ))}\n      </div>\n    </AbsoluteFill>\n  );\n};\n\n/** Don Chito encima del fondo: habla mientras suena la voz de la escena. */\nconst ChitoLayer: React.FC<{s: SceneP; vertical: boolean}> = ({s, vertical}) => {\n  const frame = useCurrentFrame();\n  const {fps, height} = useVideoConfig();\n  const t = frame / fps;\n  const words = s.words || [];\n  const end = words.length ? words[words.length - 1].t + 0.45 : s.frames / fps - 0.35;\n  const talking = t > 0.08 && t < end;\n  const enter = interpolate(frame, [0, 8], [0.9, 1], {...clamp, easing: Easing.out(Easing.back(2))});\n  return (\n    <AbsoluteFill style={{justifyContent: 'flex-end', alignItems: vertical ? 'center' : 'flex-start', paddingLeft: vertical ? 0 : 70, paddingBottom: vertical ? 120 : 10}}>\n      <div style={{scale: String(enter), transformOrigin: 'bottom center'}}>\n        <Chito pose={s.pose || 'habla'} frame={frame} talking={talking} height={Math.round(height * (vertical ? 0.46 : 0.74))} />\n      </div>\n    </AbsoluteFill>\n  );\n};\n\nconst SceneView: React.FC<{s: SceneP; i: number; vertical: boolean}> = ({s, i, vertical}) => {\n  const frame = useCurrentFrame();\n  const zoomIn = i % 2 === 0;\n  const base = interpolate(frame, [0, s.frames], zoomIn ? [1.03, 1.13] : [1.13, 1.03], clamp);\n  // Pequeño \"golpe\" de entrada en cada corte para darle ritmo.\n  const pop = interpolate(frame, [0, 7], [0.05, 0], {...clamp, easing: Easing.out(Easing.cubic)});\n  const pan = i % 3 === 0 ? [-1.6, 1.6] : i % 3 === 1 ? [1.6, -1.6] : [0, 0];\n  const x = interpolate(frame, [0, s.frames], pan, clamp);\n  return (\n    <AbsoluteFill style={{backgroundColor: PAPER, overflow: 'hidden'}}>\n      <Img\n        src={staticFile(s.img)}\n        style={{\n          position: 'absolute',\n          inset: 0,\n          width: '100%',\n          height: '100%',\n          objectFit: 'cover',\n          objectPosition: '50% 46%',\n          scale: String(base + pop),\n          translate: `${x}% 0%`,\n        }}\n      />\n      <AbsoluteFill style={{background: 'radial-gradient(ellipse at center, rgba(0,0,0,0) 60%, rgba(60,35,15,0.28) 100%)'}} />\n      <ChitoLayer s={s} vertical={vertical} />\n      <Captions s={s} vertical={vertical} />\n    </AbsoluteFill>\n  );\n};\n\nconst Hook: React.FC<{text: string; vertical: boolean}> = ({text, vertical}) => {\n  const frame = useCurrentFrame();\n  const {fps} = useVideoConfig();\n  const inS = interpolate(frame, [0, 8], [0.6, 1], {...clamp, easing: Easing.out(Easing.back(2.2))});\n  const out = interpolate(frame, [2.3 * fps, 2.7 * fps], [1, 0], clamp);\n  return (\n    <AbsoluteFill style={{justifyContent: 'flex-start', alignItems: 'center', paddingTop: vertical ? 210 : 60, opacity: out}}>\n      <div\n        style={{\n          background: RED,\n          color: '#fff6e6',\n          fontFamily: FONT,\n          fontWeight: 900,\n          fontSize: vertical ? 84 : 62,\n          lineHeight: 1.05,\n          textTransform: 'uppercase',\n          padding: vertical ? '26px 40px' : '20px 44px',\n          borderRadius: 22,\n          border: `8px solid ${INK}`,\n          boxShadow: `0 12px 0 ${INK}`,\n          maxWidth: vertical ? 960 : 1300,\n          textAlign: 'center',\n          rotate: '-2deg',\n          scale: String(inS),\n        }}\n      >\n        {text}\n      </div>\n    </AbsoluteFill>\n  );\n};\n\nconst Badge: React.FC<{text: string; vertical: boolean}> = ({text, vertical}) => (\n  <AbsoluteFill style={{justifyContent: 'flex-start', alignItems: vertical ? 'center' : 'flex-start', padding: vertical ? '120px 0 0' : '34px 40px'}}>\n    <div\n      style={{\n        background: INK,\n        color: PAPER,\n        fontFamily: FONT,\n        fontWeight: 900,\n        letterSpacing: 3,\n        fontSize: vertical ? 40 : 30,\n        padding: '10px 22px',\n        borderRadius: 999,\n        opacity: 0.88,\n      }}\n    >\n      {text}\n    </div>\n  </AbsoluteFill>\n);\n\nconst Outro: React.FC<{text: string; vertical: boolean}> = ({text, vertical}) => {\n  const frame = useCurrentFrame();\n  const y = interpolate(frame, [0, 9], [80, 0], {...clamp, easing: Easing.out(Easing.cubic)});\n  return (\n    <AbsoluteFill style={{justifyContent: 'flex-start', alignItems: 'center', paddingTop: vertical ? 210 : 60}}>\n      <div\n        style={{\n          background: YELLOW,\n          color: INK,\n          fontFamily: FONT,\n          fontWeight: 900,\n          fontSize: vertical ? 70 : 60,\n          padding: '22px 40px',\n          borderRadius: 20,\n          border: `7px solid ${INK}`,\n          translate: `0px ${y}px`,\n          textAlign: 'center',\n          maxWidth: vertical ? 900 : 1400,\n        }}\n      >\n        {text}\n      </div>\n    </AbsoluteFill>\n  );\n};\n\nexport const DonChito: React.FC<Props> = (props) => {\n  const {fps, width, height, durationInFrames} = useVideoConfig();\n  const vertical = height > width;\n  let from = 0;\n  return (\n    <AbsoluteFill style={{backgroundColor: PAPER}}>\n      {props.scenes.map((s, i) => {\n        const at = from;\n        from += s.frames;\n        return (\n          <Sequence key={i} from={at} durationInFrames={s.frames}>\n            <SceneView s={s} i={i} vertical={vertical} />\n          </Sequence>\n        );\n      })}\n      {props.badge ? <Badge text={props.badge} vertical={vertical} /> : null}\n      {props.hook ? (\n        <Sequence from={0} durationInFrames={Math.round(2.7 * fps)}>\n          <Hook text={props.hook} vertical={vertical} />\n        </Sequence>\n      ) : null}\n      {props.outro ? (\n        <Sequence from={Math.max(0, durationInFrames - Math.round(2.4 * fps))}>\n          <Outro text={props.outro} vertical={vertical} />\n        </Sequence>\n      ) : null}\n    </AbsoluteFill>\n  );\n};\n",
          "src/Chito.tsx": "import React from 'react';\n\n// Don Chito dibujado con código: bolita, palitos, sombrero, bigote y paliacate.\n// Siempre sale igual, parpadea, mueve la boca cuando habla y cambia de pose en cada escena.\nexport type Pose = 'habla' | 'senala' | 'piensa' | 'sorprendido' | 'feliz' | 'triste' | 'trabaja' | 'camina';\nexport const POSES: Pose[] = ['habla', 'senala', 'piensa', 'sorprendido', 'feliz', 'triste', 'trabaja', 'camina'];\n\nconst INK = '#1f150d';\nconst STRAW = '#e9c46a';\nconst STRAW_DARK = '#c99a3c';\nconst RED = '#c0392b';\nconst W = 10; // grosor de línea\n\ntype P = [number, number];\nconst S: P = [200, 330]; // hombros\nconst HIP: P = [200, 480];\n\nfunction arms(pose: Pose, f: number): [P, P, P, P] {\n  const s = Math.sin(f / 5), s2 = Math.sin(f / 3.2);\n  switch (pose) {\n    case 'senala':\n      return [[160, 400], [150, 470], [285, 318], [372, 296 + 3 * s]];\n    case 'piensa':\n      return [[140, 385], [178, 425], [272, 385], [228, 272]];\n    case 'sorprendido':\n      return [[138, 272], [112 + 3 * s2, 188], [262, 272], [288 - 3 * s2, 188]];\n    case 'feliz':\n      return [[136, 285], [104, 206 + 10 * s], [264, 285], [296, 206 - 10 * s]];\n    case 'triste':\n      return [[178, 410], [176, 492], [222, 410], [224, 492]];\n    case 'trabaja':\n      return [[150, 385], [128, 440 + 22 * s2], [250, 385], [272, 440 - 22 * s2]];\n    case 'camina':\n      return [[175 + 12 * s, 405], [160 + 34 * s, 480], [225 - 12 * s, 405], [240 - 34 * s, 480]];\n    default: // habla: una mano explica, la otra abajo\n      return [[160, 400], [150, 472], [270, 352 + 6 * s], [312 + 8 * s, 300 + 14 * s]];\n  }\n}\n\nfunction legs(pose: Pose, f: number): [P, P] {\n  if (pose === 'camina') {\n    const s = Math.sin(f / 5) * 42;\n    return [[200 - s, 650], [200 + s, 650]];\n  }\n  if (pose === 'feliz' || pose === 'sorprendido') {\n    const hop = Math.max(0, Math.sin(f / 4)) * (pose === 'feliz' ? 10 : 0);\n    return [[150, 650 - hop], [250, 650 - hop]];\n  }\n  return [[155, 650], [245, 650]];\n}\n\nexport const Chito: React.FC<{pose: Pose; frame: number; talking: boolean; height: number}> = ({pose, frame, talking, height}) => {\n  const f = frame;\n  const bob = Math.sin(f / 9) * 4 + (pose === 'feliz' ? -Math.max(0, Math.sin(f / 4)) * 10 : 0);\n  const [le, lh, re, rh] = arms(pose, f);\n  const [lf, rf] = legs(pose, f);\n  const blink = f % 96 >= 90; // parpadeo\n  const open = talking ? 0.35 + 0.65 * Math.abs(Math.sin(f / 2.3)) : 0;\n  const big = pose === 'sorprendido';\n  const eyeR = big ? 11 : 8;\n  // Cejas según la emoción.\n  const brows: [P, P, P, P] =\n    pose === 'triste' ? [[160, 170], [186, 180], [214, 180], [240, 170]]\n    : pose === 'sorprendido' ? [[160, 160], [188, 154], [212, 154], [240, 160]]\n    : pose === 'piensa' ? [[160, 176], [188, 174], [212, 164], [240, 158]]\n    : pose === 'feliz' ? [[162, 172], [188, 168], [212, 168], [238, 172]]\n    : [[162, 176], [188, 174], [212, 174], [238, 176]];\n  const line = (a: P, b: P, c: P) => `M${a[0]},${a[1]} L${b[0]},${b[1]} L${c[0]},${c[1]}`;\n  let mouth: React.ReactNode;\n  if (talking) mouth = <ellipse cx={200} cy={246} rx={15} ry={3 + 11 * open} fill=\"#6b1d14\" stroke={INK} strokeWidth={5} />;\n  else if (pose === 'sorprendido') mouth = <ellipse cx={200} cy={250} rx={11} ry={13} fill=\"#6b1d14\" stroke={INK} strokeWidth={5} />;\n  else if (pose === 'triste') mouth = <path d=\"M184,254 Q200,240 216,254\" fill=\"none\" stroke={INK} strokeWidth={6} strokeLinecap=\"round\" />;\n  else mouth = <path d=\"M182,242 Q200,258 218,242\" fill=\"none\" stroke={INK} strokeWidth={6} strokeLinecap=\"round\" />;\n\n  return (\n    <svg viewBox=\"0 0 400 700\" style={{height, width: (height * 400) / 700, overflow: 'visible'}}>\n      <ellipse cx={200} cy={662} rx={110} ry={14} fill=\"rgba(0,0,0,0.18)\" />\n      <g transform={`translate(0 ${bob})`} strokeLinecap=\"round\" strokeLinejoin=\"round\">\n        {/* piernas y cuerpo */}\n        <path d={`M${lf[0]},${lf[1]} L${HIP[0]},${HIP[1]} L${rf[0]},${rf[1]}`} fill=\"none\" stroke={INK} strokeWidth={W} />\n        <path d={`M${lf[0]},${lf[1]} l-26,0 M${rf[0]},${rf[1]} l26,0`} stroke={INK} strokeWidth={W + 2} />\n        <line x1={200} y1={262} x2={HIP[0]} y2={HIP[1]} stroke={INK} strokeWidth={W} />\n        {/* brazos */}\n        <path d={line(S, le, lh)} fill=\"none\" stroke={INK} strokeWidth={W} />\n        <path d={line(S, re, rh)} fill=\"none\" stroke={INK} strokeWidth={W} />\n        <circle cx={lh[0]} cy={lh[1]} r={9} fill={INK} />\n        <circle cx={rh[0]} cy={rh[1]} r={9} fill={INK} />\n        {/* paliacate */}\n        <path d=\"M166,268 L234,268 L200,312 Z\" fill={RED} stroke={INK} strokeWidth={6} />\n        {/* cabeza */}\n        <circle cx={200} cy={192} r={76} fill=\"white\" stroke={INK} strokeWidth={W} />\n        {blink ? (\n          <>\n            <line x1={166} y1={190} x2={184} y2={190} stroke={INK} strokeWidth={6} />\n            <line x1={216} y1={190} x2={234} y2={190} stroke={INK} strokeWidth={6} />\n          </>\n        ) : (\n          <>\n            <circle cx={175} cy={190} r={eyeR} fill={INK} />\n            <circle cx={225} cy={190} r={eyeR} fill={INK} />\n            <circle cx={178} cy={187} r={2.6} fill=\"white\" />\n            <circle cx={228} cy={187} r={2.6} fill=\"white\" />\n          </>\n        )}\n        <path d={`M${brows[0][0]},${brows[0][1]} L${brows[1][0]},${brows[1][1]} M${brows[2][0]},${brows[2][1]} L${brows[3][0]},${brows[3][1]}`} stroke={INK} strokeWidth={7} />\n        {mouth}\n        {/* bigotazo */}\n        <path d=\"M200,222 C186,206 158,208 146,226 C142,236 150,244 158,236 C168,228 184,236 200,232 C216,236 232,228 242,236 C250,244 258,236 254,226 C242,208 214,206 200,222 Z\" fill={INK} />\n        {/* sombrero */}\n        <path d=\"M138,132 C134,64 160,40 200,40 C240,40 266,64 262,132 Z\" fill={STRAW} stroke={INK} strokeWidth={W} />\n        <path d=\"M140,108 L260,108 L262,128 L138,128 Z\" fill={RED} stroke={INK} strokeWidth={5} />\n        <ellipse cx={200} cy={134} rx={168} ry={26} fill={STRAW} stroke={INK} strokeWidth={W} />\n        <path d=\"M60,134 Q200,152 340,134\" fill=\"none\" stroke={STRAW_DARK} strokeWidth={5} />\n      </g>\n    </svg>\n  );\n};\n\n/** Elige la pose según lo que pasa en la escena (sin gastar IA). */\nexport function poseFor(text: string, visual: string, i: number, total: number): Pose {\n  const v = (visual + ' ' + text).toLowerCase();\n  if (i === total - 1) return 'feliz';\n  if (/point|señal|mira|look at|this is/.test(v)) return 'senala';\n  if (/think|wonder|piens|imagin|¿/.test(v) && i % 2 === 0) return 'piensa';\n  if (/surpris|shock|scared|asust|sorpren|increíble|!/.test(v)) return 'sorprendido';\n  if (/sad|worr|cry|trist|sequía|drought|sick|enferm|muri/.test(v)) return 'triste';\n  if (/walk|camin|travel|road|camino|ride|horse|caballo/.test(v)) return 'camina';\n  if (/work|milk|dig|hammer|cook|carry|plant|harvest|ordeñ|trabaj|cocin|siembr|cosech|cargar|build/.test(v)) return 'trabaja';\n  if (/happy|laugh|party|fiesta|feliz|celebr|boda|wedding/.test(v)) return 'feliz';\n  return i % 3 === 1 ? 'senala' : 'habla';\n}\n"
          };
          const KIT_DIR = process.env.REMOTION_DIR || join(WORK, 'remotion-kit');

          /** Instala Remotion la primera vez (solo cuando hay un video de Don Chito). */
          function ensureRemotion() {
            mkdirSync(join(KIT_DIR, 'src'), {recursive: true});
            for (const [name, content] of Object.entries(KIT)) writeFileSync(join(KIT_DIR, name), content);
            if (!existsSync(join(KIT_DIR, 'node_modules', '@remotion', 'cli'))) {
              log('Instalando Remotion…');
              execFileSync('npm', ['install', '--no-audit', '--no-fund', '--loglevel=error'], {cwd: KIT_DIR, stdio: 'inherit', timeout: 600000});
              execFileSync('npx', ['remotion', 'browser', 'ensure'], {cwd: KIT_DIR, stdio: 'inherit', timeout: 600000});
            }
            return KIT_DIR;
          }

          export async function renderRemotion(p) {
            const FPS = 30;
            const kit = ensureRemotion();
            const pub = join(kit, 'public', p.id);
            rmSync(pub, {recursive: true, force: true});
            mkdirSync(pub, {recursive: true});
            const work = join(WORK, p.id);
            rmSync(work, {recursive: true, force: true});
            mkdirSync(work, {recursive: true});
            const scenes = [], durations = [], segs = [];
            for (let i = 0; i < p.scenes.length; i++) {
              const s = p.scenes[i];
              if (!s.image || !s.audio || s.audio.text !== s.text) throw Error(`A la escena ${i + 1} le falta imagen o voz`);
              const ext = s.image.type === 'image/png' ? 'png' : s.image.type === 'image/webp' ? 'webp' : 'jpg';
              if (s.set && /Ilustraci[óo]n original/.test(String(s.image.label || '')) && p.channel === 'donchito') {
                // Fondo dibujado con código: se vuelve a dibujar en el formato exacto (vertical en los Shorts).
                writeFileSync(join(pub, `img-${i}.${ext}`), readFileSync(codeBackground(p, i, p.format === 'Short')));
              } else await download(s.image.url, join(pub, `img-${i}.${ext}`));
              const aud = await download(s.audio.url, join(work, `aud-${i}.mp3`));
              const dur = Math.min(30, Math.max(1.5, probe(aud) + 0.3));
              const frames = Math.round(dur * FPS);
              durations.push(Math.round((frames / FPS) * 100) / 100);
              scenes.push({img: `${p.id}/img-${i}.${ext}`, frames, text: s.text, words: Array.isArray(s.audio.words) ? s.audio.words : null, pose: poseFor(s.text, s.visualPrompt || '', i, p.scenes.length)});
              // Voz de la escena rellenada con silencio hasta su duración exacta.
              const seg = join(work, `seg-${i}.wav`);
              ff(['-i', aud, '-af', `aresample=48000,aformat=channel_layouts=stereo,apad,atrim=0:${(frames / FPS).toFixed(3)}`, '-c:a', 'pcm_s16le', seg]);
              segs.push(seg);
            }
            const vertical = p.format === 'Short';
            const props = {
              format: p.format,
              hook: String(p.coverTitle || p.title || '').toUpperCase().slice(0, vertical ? 40 : 55),
              badge: '', // sin letrero con el nombre en las imágenes (pedido de Luis)
              outro: vertical ? '▶ Historia completa en el canal' : '',
              scenes,
            };
            const propsFile = join(work, 'props.json');
            writeFileSync(propsFile, JSON.stringify(props));
            const silent = join(work, 'silent.mp4');
            const t0 = Date.now();
            execFileSync('npx', ['remotion', 'render', 'src/index.ts', 'DonChito', silent, `--props=${propsFile}`, '--muted', '--codec=h264', `--crf=${vertical ? 22 : 24}`, `--concurrency=${Math.max(1, cpus().length)}`, '--log=warn'],
              {cwd: kit, stdio: 'inherit', timeout: 100 * 60000});
            log(`Remotion terminó en ${Math.round((Date.now() - t0) / 60000)} min`);
            // Pista de voz completa (normalizada) + video.
            writeFileSync(join(work, 'segs.txt'), segs.map((f) => `file '${f}'`).join('\n'));
            const voice = join(work, 'voice.m4a');
            ff(['-f', 'concat', '-safe', '0', '-i', join(work, 'segs.txt'), '-af', 'loudnorm=I=-14:TP=-1.5:LRA=9,aresample=48000', '-c:a', 'aac', '-b:a', '160k', voice]);
            let file = join(work, 'video.mp4');
            ff(['-i', silent, '-i', voice, '-map', '0:v', '-map', '1:a', '-c:v', 'copy', '-c:a', 'copy', '-shortest', '-movflags', '+faststart', file]);
            if (statSync(file).size > 90e6) {
              const smaller = join(work, 'video-small.mp4');
              ff(['-i', file, '-c:v', 'libx264', '-preset', 'veryfast', '-crf', '30', '-maxrate', '2000k', '-bufsize', '4M', '-c:a', 'copy', '-movflags', '+faststart', smaller]);
              file = smaller;
            }
            rmSync(pub, {recursive: true, force: true});
            return {file, durations};
          }

          // ---------- Armado del video con ffmpeg ----------
          const ff = (args) => execFileSync('ffmpeg', ['-hide_banner', '-loglevel', 'error', '-y', ...args], {stdio: ['ignore', 'inherit', 'inherit']});
          const probe = (file) => Number(execFileSync('ffprobe', ['-v', 'error', '-show_entries', 'format=duration', '-of', 'csv=p=0', file]).toString().trim()) || 0;

          // Palabras sin peso para elegir la palabra clave resaltada.
          const STOP = new Set('a al ante con contra de del desde el ella ellos en entre era es esa ese eso esta este esto ha hay la las le les lo los mas me mi muy nada ni no nos o para pero por que se si sin sobre su sus te tu tú un una uno unos y ya yo cuando donde como qué cómo'.split(' '));
          const assEscape = (t) => t.replace(/[{}\\]/g, '');

          function assTime(t) {
            const cs = Math.max(0, Math.round(t * 100));
            const h = Math.floor(cs / 360000), m = Math.floor(cs / 6000) % 60, s = Math.floor(cs / 100) % 60, c = cs % 100;
            return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${String(c).padStart(2, '0')}`;
          }

          /** Subtítulos estilo Short: 2-3 palabras grandes en mayúsculas, palabra clave en amarillo y entrada con "pop". */
          export function subtitleFile(text, duration, W, H, opts = {}) {
            const vertical = H > W;
            const words = text.replace(/\s+/g, ' ').trim().split(' ').filter(Boolean);
            const per = vertical ? 3 : 5, chunks = [];
            for (let i = 0; i < words.length; i += per) chunks.push(words.slice(i, i + per));
            if (chunks.length > 1 && chunks[chunks.length - 1].length === 1) chunks[chunks.length - 2].push(...chunks.pop());
            const weight = chunks.map((c) => Math.max(5, c.join(' ').length));
            const sum = weight.reduce((a, b) => a + b, 0) || 1;
            let t = 0.05;
            const events = chunks.map((c, i) => {
              const d = (duration - 0.15) * (weight[i] / sum);
              let key = -1, best = 0;
              c.forEach((w, j) => {
                const clean = w.toLowerCase().replace(/[^a-záéíóúñü0-9]/gi, '');
                if (!STOP.has(clean) && clean.length > best) { best = clean.length; key = j; }
              });
              const line = c.map((w, j) => (j === key ? `{\\c&H0000E1FF&}${assEscape(w.toUpperCase())}{\\c&H00FFFFFF&}` : assEscape(w.toUpperCase()))).join(' ');
              const ev = `Dialogue: 1,${assTime(t)},${assTime(t + d)},Main,,0,0,0,,{\\fscx82\\fscy82\\t(0,110,\\fscx100\\fscy100)}${line}`;
              t += d;
              return ev;
            });
            if (opts.hook) {
              // Frase gancho grande al inicio para detener el scroll.
              events.unshift(`Dialogue: 2,${assTime(0)},${assTime(Math.min(2.8, duration))},Hook,,0,0,0,,{\\fad(80,250)\\fscx90\\fscy90\\t(0,140,\\fscx100\\fscy100)}${assEscape(opts.hook.toUpperCase())}`);
            }
            return [
              '[Script Info]', 'ScriptType: v4.00+', `PlayResX: ${W}`, `PlayResY: ${H}`, 'WrapStyle: 0', '',
              '[V4+ Styles]',
              'Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding',
              `Style: Main,Montserrat,${vertical ? 96 : 72},&H00FFFFFF,&H00FFFFFF,&H00000000,&H96000000,-1,0,0,0,100,100,1,0,1,${vertical ? 8 : 6},3,2,70,70,${vertical ? 620 : 140},1`,
              `Style: Hook,Montserrat,${vertical ? 124 : 88},&H00FFFFFF,&H00FFFFFF,&H00000000,&HB4101010,-1,0,0,0,100,100,1,0,3,${vertical ? 18 : 14},0,8,70,70,${vertical ? 300 : 90},1`,
              '', '[Events]', 'Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text', ...events, '',
            ].join('\n');
          }

          /** Movimiento de cámara con "punch-in" a la mitad de la escena para darle ritmo (un corte sin cambiar de imagen). */
          export function motion(i, frames) {
            const N = Math.max(1, frames - 1), half = Math.round(N / 2);
            const zoomIn = i % 3 !== 1;
            const base = zoomIn ? `1.0+0.16*on/${N}` : `1.16-0.16*on/${N}`;
            const z = `${base}+if(gte(on\\,${half})\\,0.10\\,0)`;
            const dir = i % 2 === 0 ? 1 : -1;
            const x = `(iw-iw/zoom)/2+${dir}*(iw-iw/zoom)/2*0.55*(2*on/${N}-1)`;
            const y = i % 3 === 0 ? `(ih-ih/zoom)/2+(ih-ih/zoom)/2*0.45*(2*on/${N}-1)` : `(ih-ih/zoom)*0.42`;
            return {z, x, y};
          }

          /** Índice de la escena del giro (para el destello y el golpe de sonido). */
          export function twistIndex(p) {
            const n = p.scenes.length;
            const byRole = p.scenes.findIndex((s) => s.role === 'CAMBIO DE RITMO');
            return byRole > 0 ? byRole : Math.max(1, n - 2);
          }

          export async function render(p, fetchAssets = true) {
            const W = p.format === 'Short' ? 1080 : 1920, H = p.format === 'Short' ? 1920 : 1080, FPS = 30;
            const horror = p.voiceStyle === 'suspense' || p.research?.mode === 'fiction' || p.productionSettings?.mode === 'fiction';
            const dir = join(WORK, p.id);
            rmSync(dir, {recursive: true, force: true});
            mkdirSync(dir, {recursive: true});
            const clips = [], durations = [];
            const twist = twistIndex(p);
            const hook = String(p.coverTitle || p.title || '').slice(0, 55);
            for (let i = 0; i < p.scenes.length; i++) {
              const s = p.scenes[i];
              const img = join(dir, `img-${i}.jpg`), aud = join(dir, `aud-${i}.mp3`);
              if (fetchAssets) {
                if (s.image) await download(s.image.url, img);
                if (s.audio && s.audio.text === s.text) await download(s.audio.url, aud);
              }
              const hasImg = !!s.image, hasAud = !!(s.audio && s.audio.text === s.text);
              const audioLen = hasAud ? probe(aud) : 0;
              // Ritmo: la escena dura lo que dura la voz + un respiro corto (no se estira al tiempo sugerido).
              const dur = Math.min(30, Math.max(1.5, hasAud ? audioLen + 0.25 : Number(s.duration) || 4));
              durations.push(Math.round(dur * 100) / 100);
              const frames = Math.round(dur * FPS);
              writeFileSync(join(dir, `sub-${i}.ass`), subtitleFile(s.text, dur, W, H, i === 0 && hook ? {hook} : {}));
              const m = motion(i, frames);
              const fadeOut = Math.max(0, dur - 0.18).toFixed(2);
              const look = horror ? 'eq=saturation=0.82:contrast=1.06:brightness=0.03:gamma=1.12,colorbalance=bs=0.05:bm=0.02,vignette=PI/5.5,noise=alls=5:allf=t,' : 'eq=contrast=1.04:saturation=1.05,';
              const flash = i === twist ? 'fade=t=in:st=0:d=0.22:color=white,' : 'fade=t=in:st=0:d=0.15,';
              const video = hasImg
                ? `[0:v]scale=${W * 2}:${H * 2}:force_original_aspect_ratio=increase,crop=${W * 2}:${H * 2},setsar=1,` +
                  `zoompan=z='${m.z}':x='${m.x}':y='${m.y}':d=${frames}:s=${W}x${H}:fps=${FPS},`
                : `[0:v]`;
              const filter =
                video + look +
                `format=yuv420p,subtitles=sub-${i}.ass,${flash}fade=t=out:st=${fadeOut}:d=0.18[v];` +
                `[1:a]aresample=48000,aformat=channel_layouts=stereo,apad,atrim=0:${dur.toFixed(2)},loudnorm=I=-14:TP=-1.5:LRA=9,aresample=48000[a]`;
              const inputs = hasImg ? ['-i', img] : ['-f', 'lavfi', '-i', `color=c=0x0b0d10:s=${W}x${H}:r=${FPS}:d=${dur.toFixed(2)}`];
              const audioIn = hasAud ? ['-i', aud] : ['-f', 'lavfi', '-i', 'anullsrc=r=48000:cl=stereo'];
              const out = join(dir, `clip-${i}.mp4`);
              execFileSync('ffmpeg', ['-hide_banner', '-loglevel', 'error', '-y', ...inputs, ...audioIn, '-filter_complex', filter, '-map', '[v]', '-map', '[a]',
                '-t', dur.toFixed(2), '-r', String(FPS), '-c:v', 'libx264', '-preset', 'veryfast', '-crf', p.format === 'Short' ? '23' : '24',
                '-maxrate', p.format === 'Short' ? '6M' : '4M', '-bufsize', '12M', '-pix_fmt', 'yuv420p', '-c:a', 'aac', '-b:a', '160k', '-ar', '48000', out],
                {cwd: dir, stdio: ['ignore', 'inherit', 'inherit']});
              clips.push(out);
            }
            writeFileSync(join(dir, 'list.txt'), clips.map((c) => `file '${c}'`).join('\n'));
            let file = join(dir, 'video.mp4');
            ff(['-f', 'concat', '-safe', '0', '-i', join(dir, 'list.txt'), '-c', 'copy', '-movflags', '+faststart', file]);

            // Capa de sonido: ambiente (si está activo) + "swoosh" en cada corte + golpe grave en el giro. Todo generado aquí, sin material de terceros.
            const D = durations.reduce((a, b) => a + b, 0);
            const starts = durations.map((_, i) => durations.slice(0, i).reduce((a, b) => a + b, 0));
            const inputs = ['-i', file];
            const parts = [];
            let n = 1;
            if (p.music) {
              const end = Math.max(0, D - 2.5).toFixed(2);
              inputs.push('-f', 'lavfi', '-i', `anoisesrc=d=${D.toFixed(2)}:c=brown:a=0.5,lowpass=f=260,highpass=f=35`, '-f', 'lavfi', '-i', `sine=f=55:d=${D.toFixed(2)}`, '-f', 'lavfi', '-i', `sine=f=82.4:d=${D.toFixed(2)}`);
              parts.push(`[${n}:a]volume=0.35[n0];[${n + 1}:a]volume=0.10,tremolo=f=0.15:d=0.7[n1];[${n + 2}:a]volume=0.06,tremolo=f=0.11:d=0.8[n2];` +
                `[n0][n1][n2]amix=inputs=3:normalize=0,aformat=channel_layouts=stereo,afade=t=in:st=0:d=2,afade=t=out:st=${end}:d=2.5,volume=2.6[amb]`);
              n += 3;
            }
            const sfx = [];
            starts.slice(1).forEach((st, k) => {
              if (k + 1 === twist) return;
              inputs.push('-f', 'lavfi', '-i', 'anoisesrc=d=0.45:c=pink:a=0.6');
              sfx.push(`[${n}:a]highpass=f=900,lowpass=f=6000,afade=t=in:st=0:d=0.22,afade=t=out:st=0.22:d=0.23,volume=0.16,aformat=channel_layouts=stereo,adelay=${Math.max(0, Math.round((st - 0.2) * 1000))}:all=1[w${k}]`);
              n++;
            });
            if (twist < starts.length) {
              inputs.push('-f', 'lavfi', '-i', 'sine=f=48:d=1.6', '-f', 'lavfi', '-i', 'anoisesrc=d=0.25:c=brown:a=0.9');
              sfx.push(`[${n}:a]afade=t=out:st=0:d=1.6,volume=1.1[bs];[${n + 1}:a]lowpass=f=180,afade=t=out:st=0:d=0.25,volume=0.9[bn];[bs][bn]amix=inputs=2:normalize=0,aformat=channel_layouts=stereo,adelay=${Math.round(starts[twist] * 1000)}:all=1[boom]`);
              n += 2;
            }
            const layers = [...(p.music ? ['[amb]'] : []), ...sfx.map((s) => s.match(/\[(\w+)\]$/)[1]).map((l) => `[${l}]`)];
            if (layers.length) {
              const withFx = join(dir, 'video-final.mp4');
              const graph = [...parts, ...sfx,
                `${layers.join('')}amix=inputs=${layers.length}:normalize=0,apad,atrim=0:${D.toFixed(2)}[bed]`,
                `[0:a][bed]amix=inputs=2:duration=first:normalize=0,alimiter=limit=0.95[a]`].join(';');
              ff([...inputs, '-filter_complex', graph, '-map', '0:v', '-map', '[a]', '-c:v', 'copy', '-c:a', 'aac', '-b:a', '160k', '-movflags', '+faststart', withFx]);
              file = withFx;
            }
            if (statSync(file).size > 90e6) {
              const smaller = join(dir, 'video-small.mp4');
              ff(['-i', file, '-c:v', 'libx264', '-preset', 'veryfast', '-crf', '28', '-maxrate', '2500k', '-bufsize', '5M', '-c:a', 'copy', '-movflags', '+faststart', smaller]);
              return {file: smaller, durations};
            }
            return {file, durations};
          }

          const log = (m) => console.log(new Date().toISOString().slice(11, 19) + ' ' + m);

          async function main() {
            const next = await api('robot/next', {});
            if (next.action !== 'produce') { log('Nada que hacer: ' + next.reason); return; }
            const p = next.project;
            log('Produciendo: ' + p.topic);
            try {
              await produce(p);
              log('Listo. El video espera tu aprobación en la app.');
            } catch (e) {
              log('Error: ' + e.message);
              await api('robot/report', {id: p.id, error: e.message}).catch(() => {});
              process.exitCode = 1;
            }
          }

          if (process.argv[1] && import.meta.url.endsWith(process.argv[1].split('/').pop())) await main();
          ROBOT_EOF
          node robot.mjs
